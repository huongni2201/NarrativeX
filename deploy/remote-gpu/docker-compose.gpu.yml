services:
  generation-service:
    build:
      context: ../../app/generation-service
      dockerfile: Dockerfile
    image: narrativex/generation-service:latest
    container_name: narrativex-gpu-generation-service
    restart: unless-stopped
    ports:
      - "${NARRATIVEX_WORKER_PORT:-8000}:8000"
    environment:
      - NARRATIVEX_WORKER_BEARER_TOKEN=${NARRATIVEX_WORKER_BEARER_TOKEN:-}
      - NARRATIVEX_ENVIRONMENT=production
      - NARRATIVEX_LOG_LEVEL=${NARRATIVEX_LOG_LEVEL:-INFO}
      - NARRATIVEX_MODELS_DIR=/models
      - NARRATIVEX_OUTPUTS_DIR=/outputs
      - NARRATIVEX_RESIDENCY_TRANSITION_TIMEOUT=${NARRATIVEX_RESIDENCY_TRANSITION_TIMEOUT:-30}
      - NARRATIVEX_RESIDENCY_MAX_VRAM_IDLE_MB=${NARRATIVEX_RESIDENCY_MAX_VRAM_IDLE_MB:-1500}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${MODELS_CACHE_DIR:-./data/models}:/models
      - ${OUTPUTS_CACHE_DIR:-./data/outputs}:/outputs
      - ${COMFYUI_WORKFLOWS_DIR:-./workflows}:/workflows:ro
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
