services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-narrativex}
      POSTGRES_USER: ${DB_USERNAME:-narrativex}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-narrativex} -d ${DB_NAME:-narrativex}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./app/backend-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-narrativex}
      DB_USERNAME: ${DB_USERNAME:-narrativex}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NARRATIVEX_SESSION_TIMEOUT: ${NARRATIVEX_SESSION_TIMEOUT:-7d}
      NARRATIVEX_SESSION_REDIS_NAMESPACE: ${NARRATIVEX_SESSION_REDIS_NAMESPACE:-narrativex:session}
      NARRATIVEX_OIDC_ENABLED: ${NARRATIVEX_OIDC_ENABLED:-false}
      NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED: ${NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED:-false}
      NARRATIVEX_LOCAL_USER_ID: ${NARRATIVEX_LOCAL_USER_ID:-local-dev-user}
      NARRATIVEX_FRONTEND_BASE_URL: ${NARRATIVEX_FRONTEND_BASE_URL:-http://localhost:3000}
      NARRATIVEX_MAX_STORY_CHARACTERS: ${NARRATIVEX_MAX_STORY_CHARACTERS:-500000}
      NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS: ${NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS:-120000}
      NARRATIVEX_MAX_IMPORT_FILE_SIZE: ${NARRATIVEX_MAX_IMPORT_FILE_SIZE:-10MB}
      NARRATIVEX_MAX_IMPORT_REQUEST_SIZE: ${NARRATIVEX_MAX_IMPORT_REQUEST_SIZE:-11MB}
      NARRATIVEX_MEDIA_GENERATION_ENABLED: ${NARRATIVEX_MEDIA_GENERATION_ENABLED:-false}
      NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL: ${NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL:-15m}
      NARRATIVEX_CORS_ALLOWED_ORIGINS: ${NARRATIVEX_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      VERTEX_GEMINI_ENABLED: ${VERTEX_GEMINI_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_GEMINI_MODEL: ${VERTEX_GEMINI_MODEL:-gemini-2.5-flash}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-narrativex-dev}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  ai-worker:
    build:
      context: ./app/ai-worker
      dockerfile: Dockerfile
    environment:
      WORKER_NAME: ${WORKER_NAME:-narrativex-ai-worker}
      WORKER_ENV: ${WORKER_ENV:-development}
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${DB_USERNAME:-narrativex}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-narrativex}
      POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      MEDIA_DOWNLOAD_TIMEOUT_SECONDS: ${MEDIA_DOWNLOAD_TIMEOUT_SECONDS:-120}
      MEDIA_PROBE_TIMEOUT_SECONDS: ${MEDIA_PROBE_TIMEOUT_SECONDS:-30}
      MEDIA_MAX_AUDIO_BYTES: ${MEDIA_MAX_AUDIO_BYTES:-104857600}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-104857600}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-1073741824}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-disabled}
      VERTEX_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_MODEL: ${VERTEX_GEMINI_MODEL:-gemini-2.5-flash}
      VERTEX_TIMEOUT_SECONDS: ${VERTEX_TIMEOUT_SECONDS:-120}
      IMAGE_PROVIDER_MODE: ${IMAGE_PROVIDER_MODE:-disabled}
      VERTEX_IMAGE_MODEL: ${VERTEX_IMAGE_MODEL:-gemini-2.5-flash-image}
      VERTEX_IMAGE_LOCATION: ${VERTEX_IMAGE_LOCATION:-global}
      VERTEX_IMAGE_TIMEOUT_SECONDS: ${VERTEX_IMAGE_TIMEOUT_SECONDS:-120}
      VERTEX_IMAGE_SERVICE_TIER: ${VERTEX_IMAGE_SERVICE_TIER:-standard}
      VERTEX_IMAGE_EXECUTION_MODE: ${VERTEX_IMAGE_EXECUTION_MODE:-batch}
      VERTEX_IMAGE_BATCH_MIN_ITEMS: ${VERTEX_IMAGE_BATCH_MIN_ITEMS:-1}
      VERTEX_IMAGE_BATCH_LOCATION: ${VERTEX_IMAGE_BATCH_LOCATION:-global}
      VERTEX_IMAGE_BATCH_GCS_BUCKET: ${VERTEX_IMAGE_BATCH_GCS_BUCKET:-}
      VERTEX_IMAGE_BATCH_GCS_PREFIX: ${VERTEX_IMAGE_BATCH_GCS_PREFIX:-narrativex/image-batches}
      VERTEX_IMAGE_BATCH_POLL_SECONDS: ${VERTEX_IMAGE_BATCH_POLL_SECONDS:-30}
      VERTEX_IMAGE_BATCH_HTTP_TIMEOUT_SECONDS: ${VERTEX_IMAGE_BATCH_HTTP_TIMEOUT_SECONDS:-120}
      IMAGE_MAX_OUTPUT_BYTES: ${IMAGE_MAX_OUTPUT_BYTES:-10485760}
      TTS_PROVIDER_MODE: ${TTS_PROVIDER_MODE:-disabled}
      GOOGLE_TTS_PROJECT_ID: ${GOOGLE_TTS_PROJECT_ID:-}
      GOOGLE_TTS_ENDPOINT: ${GOOGLE_TTS_ENDPOINT:-https://texttospeech.googleapis.com}
      GOOGLE_TTS_TIMEOUT_SECONDS: ${GOOGLE_TTS_TIMEOUT_SECONDS:-120}
      TTS_PRICING_CATALOG_VERSION: ${TTS_PRICING_CATALOG_VERSION:-google-tts-2026-08-20}
      VIENEU_VOICE_ID: ${VIENEU_VOICE_ID:-vieneu-ngoc-huyen-v2}
      VIENEU_VOICE_NAME: ${VIENEU_VOICE_NAME:-Ngọc Huyền v2}
      # The worker is Linux-based; pass the path inside the container, not the
      # Windows host path from .env.
      VIENEU_REFERENCE_AUDIO_PATH: ${VIENEU_REFERENCE_AUDIO_PATH:-/run/narrativex/voices/ngoc_huyen_sample.wav}
      VIENEU_BACKEND: ${VIENEU_BACKEND:-auto}
      VIENEU_PRECISION: ${VIENEU_PRECISION:-int8}
      VIENEU_THREADS: ${VIENEU_THREADS:-0}
      VIENEU_DENOISE_REFERENCE: ${VIENEU_DENOISE_REFERENCE:-true}
      VIENEU_SAVE_VOICE_PROFILE: ${VIENEU_SAVE_VOICE_PROFILE:-true}
      VIENEU_FORCE_REENROLL: ${VIENEU_FORCE_REENROLL:-false}
      VIENEU_APPLY_WATERMARK: ${VIENEU_APPLY_WATERMARK:-false}
      MEDIA_STORAGE_MODE: ${MEDIA_STORAGE_MODE:-disabled}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-narrativex-dev}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      # The worker runs as appuser, so the host's ADC directory must be mounted at a
      # container path. Keep the source outside the repository and read-only.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/home/appuser/.config/gcloud/application_default_credentials.json}
    volumes:
      - "${GOOGLE_CLOUD_CONFIG_HOST:-${APPDATA}/gcloud}:/home/appuser/.config/gcloud:ro"
      # Mount the host directory containing the optional VieNeu reference WAV.
      # The worker always sees it under /run/narrativex/voices.
      - "${VIENEU_REFERENCE_AUDIO_HOST_DIR:-./.runtime/voices}:/run/narrativex/voices:ro"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
