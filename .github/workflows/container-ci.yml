name: Container CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/backend-service/**'
      - 'app/frontend-web/**'
      - 'app/ai-worker/**'
      - 'docker-compose.real.yml'
      - 'docker-compose.ci.yml'
      - 'docker-compose.prod.yml'
      - 'Caddyfile.prod'
      - '.env.example'
      - '.env.prod.example'
      - 'scripts/check-image-config-contract.py'
      - '.github/workflows/container-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/backend-service/**'
      - 'app/frontend-web/**'
      - 'app/ai-worker/**'
      - 'docker-compose.real.yml'
      - 'docker-compose.ci.yml'
      - 'docker-compose.prod.yml'
      - 'Caddyfile.prod'
      - '.env.example'
      - '.env.prod.example'
      - 'scripts/check-image-config-contract.py'
      - '.github/workflows/container-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Validate Compose contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate CI Compose config
        run: docker compose --env-file .env.example -f docker-compose.ci.yml config --quiet

      - name: Validate real Docker Compose config
        run: >-
          GCP_SERVICE_ACCOUNT_FILE=/tmp/ci-gcp-service-account.json
          VIENEU_REFERENCE_AUDIO_FILE=/tmp/ci-reference.wav
          docker compose --env-file .env.example -f docker-compose.real.yml config --quiet

      - name: Validate production Compose config
        run: >-
          CLOUDFLARE_TUNNEL_TOKEN=ci-placeholder
          docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet

      - name: Validate image config contract
        run: python scripts/check-image-config-contract.py

      - name: Validate production Caddy config
        run: >-
          docker run --rm
          -e APP_DOMAIN=example.com
          -e ACME_EMAIL=admin@example.com
          -v "${PWD}/Caddyfile.prod:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./app/backend-service
            dockerfile: ./app/backend-service/Dockerfile
          - service: frontend
            context: ./app/frontend-web
            dockerfile: ./app/frontend-web/Dockerfile
          - service: ai-worker
            context: ./app/ai-worker
            dockerfile: ./app/ai-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "narrativex/${{ matrix.service }}:${{ github.sha }}"
          "${{ matrix.context }}"
