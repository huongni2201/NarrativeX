name: Container CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/backend-service/**'
      - 'app/frontend-web/**'
      - 'app/ai-worker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'Caddyfile.prod'
      - '.env.example'
      - '.env.prod.example'
      - '.github/workflows/container-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/backend-service/**'
      - 'app/frontend-web/**'
      - 'app/ai-worker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'Caddyfile.prod'
      - '.env.example'
      - '.env.prod.example'
      - '.github/workflows/container-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Validate Compose contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate local Compose config
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Validate production Compose config
        run: docker compose --env-file .env.prod.example -f docker-compose.prod.yml config --quiet

      - name: Validate production Caddy config
        run: >-
          docker run --rm
          -e APP_DOMAIN=example.com
          -e ACME_EMAIL=admin@example.com
          -v "${PWD}/Caddyfile.prod:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./app/backend-service
            dockerfile: ./app/backend-service/Dockerfile
          - service: frontend
            context: ./app/frontend-web
            dockerfile: ./app/frontend-web/Dockerfile
          - service: ai-worker
            context: ./app/ai-worker
            dockerfile: ./app/ai-worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "narrativex/${{ matrix.service }}:${{ github.sha }}"
          "${{ matrix.context }}"
