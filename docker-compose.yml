services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-narrativex}
      POSTGRES_USER: ${DB_USERNAME:-narrativex}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-narrativex} -d ${DB_NAME:-narrativex}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./app/backend-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-narrativex}
      DB_USERNAME: ${DB_USERNAME:-narrativex}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NARRATIVEX_SESSION_TIMEOUT: ${NARRATIVEX_SESSION_TIMEOUT:-7d}
      NARRATIVEX_SESSION_REDIS_NAMESPACE: ${NARRATIVEX_SESSION_REDIS_NAMESPACE:-narrativex:session}
      NARRATIVEX_OIDC_ENABLED: ${NARRATIVEX_OIDC_ENABLED:-false}
      NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED: ${NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED:-false}
      NARRATIVEX_LOCAL_USER_ID: ${NARRATIVEX_LOCAL_USER_ID:-local-dev-user}
      NARRATIVEX_FRONTEND_BASE_URL: ${NARRATIVEX_FRONTEND_BASE_URL:-http://localhost:3000}
      NARRATIVEX_MAX_STORY_CHARACTERS: ${NARRATIVEX_MAX_STORY_CHARACTERS:-500000}
      NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS: ${NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS:-120000}
      NARRATIVEX_CORS_ALLOWED_ORIGINS: ${NARRATIVEX_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      VERTEX_GEMINI_ENABLED: ${VERTEX_GEMINI_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_GEMINI_MODEL: ${VERTEX_GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  ai-worker:
    build:
      context: ./app/ai-worker
      dockerfile: Dockerfile
    environment:
      WORKER_NAME: ${WORKER_NAME:-narrativex-ai-worker}
      WORKER_ENV: ${WORKER_ENV:-development}
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${DB_USERNAME:-narrativex}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-narrativex}
      POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      PROVIDER_MODE: ${AI_PROVIDER_MODE:-disabled}
      VERTEX_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT:-}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-central1}
      VERTEX_MODEL: ${VERTEX_GEMINI_MODEL:-gemini-2.5-flash}
      VERTEX_TIMEOUT_SECONDS: ${VERTEX_TIMEOUT_SECONDS:-120}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-narrativex}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
