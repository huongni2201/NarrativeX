name: ${COMPOSE_PROJECT_NAME:-narrativex}

x-postgres-environment: &postgres-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-narrativex}
  DB_USERNAME: ${DB_USERNAME:-narrativex}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

x-build-args: &build-args
  BUILD_SHA: ${BUILD_SHA:-local}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-narrativex}
      POSTGRES_USER: ${DB_USERNAME:-narrativex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-narrativex} -d ${DB_NAME:-narrativex}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]
    networks: [appnet]

  backend:
    image: ${BACKEND_IMAGE:-narrativex-backend}:${BUILD_SHA:-local}
    build:
      context: ./app/backend-service
      dockerfile: Dockerfile
      args: *build-args
    restart: unless-stopped
    environment:
      <<: *postgres-environment
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      BUILD_SHA: ${BUILD_SHA:-local}
      NARRATIVEX_PUBLIC_BASE_URL: ${NARRATIVEX_PUBLIC_BASE_URL:?Set NARRATIVEX_PUBLIC_BASE_URL in .env}
      NARRATIVEX_CORS_ALLOWED_ORIGINS: "${NARRATIVEX_CORS_ALLOWED_ORIGINS:-}"
      NARRATIVEX_MAX_STORY_CHARACTERS: ${NARRATIVEX_MAX_STORY_CHARACTERS:-500000}
      NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS: ${NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS:-120000}
      NARRATIVEX_MAX_IMPORT_FILE_SIZE: ${NARRATIVEX_MAX_IMPORT_FILE_SIZE:-10MB}
      NARRATIVEX_MAX_IMPORT_REQUEST_SIZE: ${NARRATIVEX_MAX_IMPORT_REQUEST_SIZE:-11MB}
      NARRATIVEX_MEDIA_GENERATION_ENABLED: "true"
      NARRATIVEX_IMAGE_PROVIDER_KEY: ${NARRATIVEX_IMAGE_PROVIDER_KEY:-realvisxl}
      NARRATIVEX_COMPUTE_BASE_URL: http://generation-service:8010
      NARRATIVEX_COMPUTE_MACHINE_TOKEN: ${GENERATION_SERVICE_MACHINE_TOKEN:?Set GENERATION_SERVICE_MACHINE_TOKEN in .env}
      NARRATIVEX_COMPUTE_ARTIFACT_BASE_URL: http://backend:8080
      NARRATIVEX_IMAGE_MODEL: ${NARRATIVEX_IMAGE_MODEL:-realvisxl}
      NARRATIVEX_IMAGE_EXECUTION_MODE: ${NARRATIVEX_IMAGE_EXECUTION_MODE:-batch}
      NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL: ${NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL:-15m}
      PROJECT_MEDIA_LOCAL_DIR: /data/narrativex/project-media
    volumes:
      - type: bind
        source: ${PROJECT_MEDIA_HOST_DIR:?Set PROJECT_MEDIA_HOST_DIR in .env}
        target: /data/narrativex/project-media
        bind:
          create_host_path: true
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      generation-service: { condition: service_healthy }
    networks: [appnet]

  generation-service:
    image: ${GENERATION_SERVICE_IMAGE:-narrativex-generation-service}:${BUILD_SHA:-local}
    build:
      context: ./app/generation-service
      dockerfile: Dockerfile
      args: *build-args
    restart: unless-stopped
    environment:
      GENERATION_SERVICE_HOST: 0.0.0.0
      GENERATION_SERVICE_PORT: 8010
      GENERATION_SERVICE_MACHINE_TOKEN: ${GENERATION_SERVICE_MACHINE_TOKEN:?Set GENERATION_SERVICE_MACHINE_TOKEN in .env}
      GENERATION_SERVICE_JOURNAL_FILE: /var/lib/generation-service/generation-service.sqlite3
      GENERATION_MAX_CONCURRENCY: ${GENERATION_MAX_CONCURRENCY:-1}
      GENERATION_SERVICE_MAX_REQUEST_BYTES: ${GENERATION_SERVICE_MAX_REQUEST_BYTES:-1048576}
      GENERATION_SERVICE_MAX_ARTIFACT_BYTES: ${GENERATION_SERVICE_MAX_ARTIFACT_BYTES:-2147483648}
      GENERATION_SERVICE_COMFYUI_BASE_URL: ${GENERATION_SERVICE_COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      GENERATION_SERVICE_COMFYUI_TIMEOUT_SECONDS: ${GENERATION_SERVICE_COMFYUI_TIMEOUT_SECONDS:-120}
      GENERATION_SERVICE_VIENEU_BASE_URL: ${GENERATION_SERVICE_VIENEU_BASE_URL:-http://host.docker.internal:8008}
      GENERATION_SERVICE_VIENEU_API_KEY: ${GENERATION_SERVICE_VIENEU_API_KEY:-}
      GENERATION_SERVICE_VIENEU_TIMEOUT_SECONDS: ${GENERATION_SERVICE_VIENEU_TIMEOUT_SECONDS:-300}
      GENERATION_SERVICE_WHISPERX_DEVICE: ${GENERATION_SERVICE_WHISPERX_DEVICE:-cuda}
      GENERATION_SERVICE_WHISPERX_ALIGN_MODEL_NAME: ${GENERATION_SERVICE_WHISPERX_ALIGN_MODEL_NAME:-}
    volumes:
      - generation-service-journal:/var/lib/generation-service
    ports: ["127.0.0.1:8010:8010"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [appnet]

networks:
  appnet: { driver: bridge }
volumes:
  postgres-data:
  generation-service-journal:
