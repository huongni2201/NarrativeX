spring:
  application:
    name: NarrativeX Backend
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:narrativex}
    username: ${DB_USERNAME:narrativex}
    password: ${DB_PASSWORD:narrativex}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${NARRATIVEX_DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      leak-detection-threshold: ${NARRATIVEX_DB_LEAK_DETECTION_MS:0}
  session:
    timeout: ${NARRATIVEX_SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: ${NARRATIVEX_MAX_IMPORT_FILE_SIZE:10MB}
      max-request-size: ${NARRATIVEX_MAX_IMPORT_REQUEST_SIZE:11MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mybatis/*.xml
  type-handlers-package: com.narrativex.backend.feature.assets.infrastructure.persistence.mybatis
  configuration:
    map-underscore-to-camel-case: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

narrativex:
  public-base-url: ${NARRATIVEX_PUBLIC_BASE_URL:}
  compute:
    base-url: ${NARRATIVEX_COMPUTE_BASE_URL:http://localhost:8010}
    machine-token: ${NARRATIVEX_COMPUTE_MACHINE_TOKEN:default-dev-machine-token}
    callback-secret: ${NARRATIVEX_COMPUTE_CALLBACK_SECRET:${NARRATIVEX_COMPUTE_MACHINE_TOKEN:default-dev-machine-token}}
    artifact-base-url: ${NARRATIVEX_COMPUTE_ARTIFACT_BASE_URL:http://localhost:8080}
    artifact-ttl: ${NARRATIVEX_COMPUTE_ARTIFACT_TTL:15m}
    max-artifact-bytes: ${NARRATIVEX_MAX_COMPUTE_ARTIFACT_BYTES:268435456}
  generation:
    media-enabled: ${NARRATIVEX_MEDIA_GENERATION_ENABLED:false}
    sse:
      # legacy: per-job polling + in-memory project broadcast. notify: PostgreSQL NOTIFY hub (F3).
      # Switch to notify only after runtime verification; legacy is removed in a later change.
      mode: ${NARRATIVEX_SSE_MODE:legacy}
    dispatch:
      # Lane-based parallel outbox dispatch. Keep false until the full verification gate passes.
      parallel-enabled: ${NARRATIVEX_DISPATCH_PARALLEL_ENABLED:false}
      lanes:
        analysis: ${NARRATIVEX_DISPATCH_ANALYSIS_LANE:2}
        media: ${NARRATIVEX_DISPATCH_MEDIA_LANE:4}
    image:
      provider-key: ${NARRATIVEX_IMAGE_PROVIDER_KEY:realvisxl}
      model: ${NARRATIVEX_IMAGE_MODEL:realvisxl-checkpoint.safetensors}
      execution-mode: ${NARRATIVEX_IMAGE_EXECUTION_MODE:BATCH}
  video:
    default-provider: ${NARRATIVEX_VIDEO_DEFAULT_PROVIDER:ltx}
    default-model: ${NARRATIVEX_VIDEO_DEFAULT_MODEL:ltx-2.5-22b-distilled-int8}
    default-quality-profile: ${NARRATIVEX_VIDEO_DEFAULT_QUALITY_PROFILE:720p_24fps_standard}
    default-profile: ${NARRATIVEX_VIDEO_DEFAULT_PROFILE:ltx-2.5-22b-distilled-int8-native-av-v1}
    model-revision: ${NARRATIVEX_VIDEO_MODEL_REVISION:5e6e71018ee1756ed329b697a7b4aedc934dfce9}
    workflow-revision: ${NARRATIVEX_VIDEO_WORKFLOW_REVISION:video.generate:1.1}
  limits:
    max-story-characters: ${NARRATIVEX_MAX_STORY_CHARACTERS:500000}
    max-estimated-input-tokens: ${NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS:120000}
  storage:
    upload-intent-ttl: ${NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL:15m}
    project-media-local-dir: ${PROJECT_MEDIA_LOCAL_DIR:/data/narrativex/project-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n"
  level:
    root: INFO
    com.narrativex.backend: INFO
