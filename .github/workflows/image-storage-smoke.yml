name: Real Image Storage Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_paid_call:
        description: "This makes one paid Vertex image batch call and writes smoke artifacts to R2/Drive"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"
      vertex_project_id:
        description: "Google Cloud project ID"
        required: true
        type: string
      vertex_image_location:
        description: "Vertex image location"
        required: true
        default: "global"
        type: string
      vertex_image_batch_location:
        description: "Vertex batch location"
        required: true
        default: "global"
        type: string
      vertex_image_batch_gcs_bucket:
        description: "GCS bucket used for Vertex batch staging"
        required: true
        type: string
      r2_account_id:
        description: "Cloudflare account ID"
        required: true
        type: string
      r2_bucket:
        description: "R2 bucket used for generated media"
        required: true
        type: string

permissions:
  contents: read

jobs:
  image-storage-smoke:
    if: ${{ inputs.confirm_paid_call == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/ai-worker/pyproject.toml

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install worker
        run: python -m pip install ./app/ai-worker

      - name: Materialize Google service account
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing repository secret GCP_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-service-account.json"
          chmod 600 "$RUNNER_TEMP/gcp-service-account.json"

      - name: Require storage secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REFRESH_TOKEN GOOGLE_DRIVE_FOLDER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret $name" >&2
              exit 1
            fi
          done

      - name: Run paid image and storage smoke
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-service-account.json
          VERTEX_PROJECT_ID: ${{ inputs.vertex_project_id }}
          VERTEX_IMAGE_MODEL: gemini-2.5-flash-image
          VERTEX_IMAGE_LOCATION: ${{ inputs.vertex_image_location }}
          VERTEX_IMAGE_BATCH_LOCATION: ${{ inputs.vertex_image_batch_location }}
          VERTEX_IMAGE_BATCH_GCS_BUCKET: ${{ inputs.vertex_image_batch_gcs_bucket }}
          VERTEX_IMAGE_BATCH_GCS_PREFIX: narrativex/provider-smoke
          PROVIDER_SMOKE_TIMEOUT_SECONDS: "900"
          R2_ACCOUNT_ID: ${{ inputs.r2_account_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ inputs.r2_bucket }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_TIMEOUT_SECONDS: "120"
        run: python -m narrativex_worker.provider_image_storage_smoke
