name: Fix Cursor Consumers

on:
  push:
    branches:
      - agent/feature-boundaries-keyset-pagination-v2
    paths:
      - '.github/workflows/fix-cursor-consumers.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/feature-boundaries-keyset-pagination-v2
      - name: Replace legacy page parameters
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/frontend-web/src/features/characters/CharacterBibleModal.tsx
            app/frontend-web/src/features/dashboard/ProjectsDashboard.tsx
            app/frontend-web/src/features/production/ProductionShell.tsx
          )
          for file in "${files[@]}"; do
            sed -i 's/api\.listProjects({ page: PROJECT_PAGE, size: PROJECT_PAGE_SIZE })/api.listProjects({ limit: PROJECT_PAGE_SIZE })/g' "$file"
          done
          rm -f .github/workflows/fix-cursor-consumers.yml
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: migrate project list consumers to cursor pagination'
          git push origin HEAD:agent/feature-boundaries-keyset-pagination-v2
