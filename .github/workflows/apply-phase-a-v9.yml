name: Apply Phase A Product Refactor V9

on:
  push:
    branches: [agent/full-api-runtime-integration]
    paths: ['.github/workflows/apply-phase-a-v9.yml']

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-api-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend-web/package-lock.json

      - name: Apply phase A v8 transformation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-phase-a-v8.yml').read_text(encoding='utf-8')
          first = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          first_end = source.index("\n          PY\n", first)
          first_lines = source[first:first_end].splitlines()
          Path('/tmp/a1.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in first_lines), encoding='utf-8')
          second = source.index("          python <<'PY'\n", first_end) + len("          python <<'PY'\n")
          second_end = source.index("\n          PY\n", second)
          second_lines = source[second:second_end].splitlines()
          Path('/tmp/a2.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in second_lines), encoding='utf-8')
          PY
          python /tmp/a1.py
          python /tmp/a2.py
          python <<'PY'
          from pathlib import Path
          p = Path('app/backend-service/src/test/java/com/narrativex/backend/feature/generation/api/GenerationJobControllerContractTest.java')
          text = p.read_text(encoding='utf-8')
          text = text.replace('new GetGenerationJobQuery("job-1", "owner")', 'new GetGenerationJobQuery("job-1", null)')
          text = text.replace('getMapsPathAndHeaderToQueryAndReturnsUseCaseEnvelope', 'getMapsPathToQueryAndReturnsUseCaseEnvelope')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify backend
        working-directory: app/backend-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify frontend
        working-directory: app/frontend-web
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run build

      - name: Commit product code only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app AGENTS.md README.md documentation contracts || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: use security context and real project APIs'
          git push origin HEAD:agent/full-api-runtime-integration
