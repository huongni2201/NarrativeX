name: ${COMPOSE_PROJECT_NAME:-narrativex-dev}

# Local Desktop development stack.
# This intentionally exposes the backend only on loopback so the Electron app
# can call http://localhost:8080 without exposing the API to the LAN.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-narrativex}
      POSTGRES_USER: ${DB_USERNAME:-narrativex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-narrativex}
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-narrativex} -d ${DB_NAME:-narrativex}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [appnet]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-dev-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  backend:
    build:
      context: ./app/backend-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # Docker Compose v2 treats these files as optional. Keep real secrets out of git.
    # app/backend-service/.env is the preferred local backend file.
    env_file:
      - path: ./.env
        required: false
      - path: ./app/backend-service/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-narrativex}
      DB_USERNAME: ${DB_USERNAME:-narrativex}
      DB_PASSWORD: ${DB_PASSWORD:-narrativex}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NARRATIVEX_OIDC_ENABLED: "true"
      NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED: "false"
      NARRATIVEX_FRONTEND_BASE_URL: http://localhost:5173
      NARRATIVEX_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,null
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data:
