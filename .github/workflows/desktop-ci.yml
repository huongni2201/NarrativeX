name: Desktop CI

on:
  pull_request:
    paths:
      - "app/desktop/**"
      - "packages/client-contracts/**"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/auth/**"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/localexecution/**"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/controller/ProductionRenderController.java"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/request/CreateProjectRenderRequest.java"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/application/usecase/CreateProjectRenderUseCase.java"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/domain/enums/RenderExecutionTarget.java"
      - "app/backend-service/src/main/resources/db/migration/**"
      - "app/backend-service/src/main/resources/mybatis/LocalProjectRenderMapper.xml"
      - "app/backend-service/src/test/java/com/narrativex/backend/architecture/**"
      - "app/backend-service/src/test/java/com/narrativex/backend/configuration/SecurityConfigurationTest.java"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/auth/**"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/localexecution/**"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/generation/application/usecase/CreateProjectRenderUseCaseTest.java"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/storyboard/api/ChapterCreationApiIntegrationTest.java"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/desktop/**"
      - "packages/client-contracts/**"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/auth/**"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/localexecution/**"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/controller/ProductionRenderController.java"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/request/CreateProjectRenderRequest.java"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/application/usecase/CreateProjectRenderUseCase.java"
      - "app/backend-service/src/main/java/com/narrativex/backend/feature/generation/domain/enums/RenderExecutionTarget.java"
      - "app/backend-service/src/main/resources/db/migration/**"
      - "app/backend-service/src/main/resources/mybatis/LocalProjectRenderMapper.xml"
      - "app/backend-service/src/test/java/com/narrativex/backend/architecture/**"
      - "app/backend-service/src/test/java/com/narrativex/backend/configuration/SecurityConfigurationTest.java"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/auth/**"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/localexecution/**"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/generation/application/usecase/CreateProjectRenderUseCaseTest.java"
      - "app/backend-service/src/test/java/com/narrativex/backend/feature/storyboard/api/ChapterCreationApiIntegrationTest.java"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  desktop-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build desktop
        run: npm run build

  backend-desktop-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml

      - name: Compile backend
        run: ./mvnw -DskipTests compile

      - name: Validate schema and desktop-facing backend contracts
        run: >-
          ./mvnw
          -Dtest=FlywayBaselineStructureTest,MyBatisSchemaReferenceContractTest,SecurityConfigurationTest,DesktopAuthControllerTest,LocalProjectRenderUseCaseTest,LocalProjectRenderControllerTest,CreateProjectRenderUseCaseTest,ChapterCreationApiIntegrationTest
          test
