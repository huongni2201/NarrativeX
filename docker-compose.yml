name: ${COMPOSE_PROJECT_NAME:-narrativex-prod}

x-postgres-environment: &postgres-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

x-worker-database-environment: &worker-database-environment
  DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}

x-build-args: &build-args
  BUILD_SHA: ${BUILD_SHA:-local}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]
    networks: [appnet]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  backend:
    image: ${BACKEND_IMAGE:-narrativex-backend}:${BUILD_SHA:-local}
    build:
      context: ./app/backend-service
      dockerfile: Dockerfile
      args: *build-args
    restart: unless-stopped
    environment:
      <<: *postgres-environment
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      BUILD_SHA: ${BUILD_SHA:-local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NARRATIVEX_SESSION_TIMEOUT: ${NARRATIVEX_SESSION_TIMEOUT}
      NARRATIVEX_SESSION_REDIS_NAMESPACE: ${NARRATIVEX_SESSION_REDIS_NAMESPACE}
      NARRATIVEX_OIDC_ENABLED: ${NARRATIVEX_OIDC_ENABLED}
      NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED: "false"
      NARRATIVEX_PUBLIC_BASE_URL: ${NARRATIVEX_PUBLIC_BASE_URL:-https://${APP_DOMAIN}}
      NARRATIVEX_CORS_ALLOWED_ORIGINS: ${NARRATIVEX_CORS_ALLOWED_ORIGINS:-null}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      NARRATIVEX_MAX_STORY_CHARACTERS: ${NARRATIVEX_MAX_STORY_CHARACTERS}
      NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS: ${NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS}
      NARRATIVEX_MAX_IMPORT_FILE_SIZE: ${NARRATIVEX_MAX_IMPORT_FILE_SIZE}
      NARRATIVEX_MAX_IMPORT_REQUEST_SIZE: ${NARRATIVEX_MAX_IMPORT_REQUEST_SIZE}
      NARRATIVEX_MEDIA_GENERATION_ENABLED: "true"
      NARRATIVEX_GENERATION_SSE_ENABLED: "true"
      NARRATIVEX_IMAGE_PROVIDER_KEY: ${NARRATIVEX_IMAGE_PROVIDER_KEY:-vertex}
      NARRATIVEX_IMAGE_MODEL: ${NARRATIVEX_IMAGE_MODEL:-gemini-2.5-flash-image}
      NARRATIVEX_IMAGE_PRICING_VERSION: ${NARRATIVEX_IMAGE_PRICING_VERSION:-gemini-2.5-flash-image-batch-2026-08-22}
      NARRATIVEX_IMAGE_EXECUTION_MODE: ${NARRATIVEX_IMAGE_EXECUTION_MODE:-batch}
      NARRATIVEX_IMAGE_UNIT_COST_DRAFT: ${NARRATIVEX_IMAGE_UNIT_COST_DRAFT:-0.10}
      NARRATIVEX_IMAGE_UNIT_COST_STANDARD: ${NARRATIVEX_IMAGE_UNIT_COST_STANDARD:-0.25}
      NARRATIVEX_IMAGE_UNIT_COST_HIGH: ${NARRATIVEX_IMAGE_UNIT_COST_HIGH:-0.40}
      NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL: ${NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL}
      FINAL_VIDEO_STORAGE_MODE: ${FINAL_VIDEO_STORAGE_MODE:-google-drive}
      VERTEX_GEMINI_ENABLED: "true"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      VERTEX_LOCATION: ${VERTEX_LOCATION}
      VERTEX_GEMINI_MODEL: ${VERTEX_GEMINI_MODEL}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
    # Desktop development and the system-browser OAuth handoff run on the host,
    # so the backend must be reachable at http://localhost:8080. Keep the bind
    # loopback-only; worker services continue using http://backend:8080.
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [appnet]

  ai-worker:
    image: ${AI_WORKER_IMAGE:-narrativex-ai-worker}:${BUILD_SHA:-local}
    build:
      context: ./app/ai-worker
      dockerfile: Dockerfile
      target: worker-image
      args: *build-args
    restart: unless-stopped
    environment:
      <<: *worker-database-environment
      WORKER_NAME: narrativex-prod-ai
      WORKER_ENV: production
      WORKER_ROLES: analysis,translation,media-validation,image-generation
      LOG_LEVEL: ${WORKER_LOG_LEVEL}
      BACKEND_URL: http://backend:8080
      BUILD_SHA: ${BUILD_SHA:-local}
      POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS}
      WORKER_CONCURRENCY: ${GENERAL_WORKER_CONCURRENCY}
      MEDIA_DOWNLOAD_TIMEOUT_SECONDS: ${MEDIA_DOWNLOAD_TIMEOUT_SECONDS}
      MEDIA_PROBE_TIMEOUT_SECONDS: ${MEDIA_PROBE_TIMEOUT_SECONDS}
      MEDIA_MAX_AUDIO_BYTES: ${MEDIA_MAX_AUDIO_BYTES}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES}
      AI_PROVIDER_MODE: vertex
      VERTEX_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT}
      VERTEX_LOCATION: ${VERTEX_LOCATION}
      VERTEX_MODEL: ${VERTEX_GEMINI_MODEL}
      VERTEX_TIMEOUT_SECONDS: ${VERTEX_TIMEOUT_SECONDS}
      IMAGE_PROVIDER_MODE: vertex
      VERTEX_IMAGE_MODEL: ${NARRATIVEX_IMAGE_MODEL:-gemini-2.5-flash-image}
      VERTEX_IMAGE_LOCATION: ${VERTEX_IMAGE_LOCATION}
      VERTEX_IMAGE_TIMEOUT_SECONDS: ${VERTEX_IMAGE_TIMEOUT_SECONDS}
      VERTEX_IMAGE_SERVICE_TIER: standard
      VERTEX_IMAGE_EXECUTION_MODE: ${NARRATIVEX_IMAGE_EXECUTION_MODE:-batch}
      VERTEX_IMAGE_BATCH_MAX_ITEMS: ${VERTEX_IMAGE_BATCH_MAX_ITEMS}
      VERTEX_IMAGE_BATCH_LOCATION: ${VERTEX_IMAGE_BATCH_LOCATION}
      VERTEX_IMAGE_BATCH_GCS_BUCKET: ${VERTEX_IMAGE_BATCH_GCS_BUCKET}
      VERTEX_IMAGE_BATCH_GCS_PREFIX: ${VERTEX_IMAGE_BATCH_GCS_PREFIX}
      VERTEX_IMAGE_BATCH_POLL_SECONDS: ${VERTEX_IMAGE_BATCH_POLL_SECONDS}
      VERTEX_IMAGE_BATCH_HTTP_TIMEOUT_SECONDS: ${VERTEX_IMAGE_BATCH_HTTP_TIMEOUT_SECONDS}
      VERTEX_IMAGE_UNKNOWN_MAX_AGE_SECONDS: ${VERTEX_IMAGE_UNKNOWN_MAX_AGE_SECONDS}
      IMAGE_RECONCILE_MAX_ATTEMPTS: ${IMAGE_RECONCILE_MAX_ATTEMPTS:-5}
      IMAGE_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${IMAGE_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      IMAGE_CIRCUIT_BREAKER_OPEN_SECONDS: ${IMAGE_CIRCUIT_BREAKER_OPEN_SECONDS:-120}
      IMAGE_MAX_OUTPUT_BYTES: ${IMAGE_MAX_OUTPUT_BYTES}
      TTS_PROVIDER_MODE: disabled
      MEDIA_STORAGE_MODE: r2
      FINAL_VIDEO_STORAGE_MODE: ${FINAL_VIDEO_STORAGE_MODE:-google-drive}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account.json
    volumes:
      - type: bind
        source: ${GCP_SERVICE_ACCOUNT_FILE}
        target: /run/secrets/gcp-service-account.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [appnet]

  narration-worker:
    image: ${NARRATION_WORKER_IMAGE:-narrativex-narration-worker}:${BUILD_SHA:-local}
    build:
      context: ./app/ai-worker
      dockerfile: Dockerfile
      target: worker-narration
      args: *build-args
    restart: unless-stopped
    environment:
      <<: *worker-database-environment
      WORKER_NAME: narrativex-prod-narration
      WORKER_ENV: production
      WORKER_ROLES: narration
      LOG_LEVEL: ${WORKER_LOG_LEVEL}
      BACKEND_URL: http://backend:8080
      BUILD_SHA: ${BUILD_SHA:-local}
      POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS}
      WORKER_CONCURRENCY: ${NARRATION_WORKER_CONCURRENCY}
      MEDIA_DOWNLOAD_TIMEOUT_SECONDS: ${MEDIA_DOWNLOAD_TIMEOUT_SECONDS}
      MEDIA_PROBE_TIMEOUT_SECONDS: ${MEDIA_PROBE_TIMEOUT_SECONDS}
      MEDIA_MAX_AUDIO_BYTES: ${MEDIA_MAX_AUDIO_BYTES}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES}
      AI_PROVIDER_MODE: disabled
      IMAGE_PROVIDER_MODE: disabled
      TTS_PROVIDER_MODE: vieneu
      NARRATION_MP3_BITRATE: ${NARRATION_MP3_BITRATE}
      VIENEU_VOICE_ID: ${VIENEU_VOICE_ID}
      VIENEU_VOICE_NAME: ${VIENEU_VOICE_NAME}
      VIENEU_REFERENCE_AUDIO_PATH: /run/narrativex/voices/reference.wav
      VIENEU_BACKEND: ${VIENEU_BACKEND}
      VIENEU_PRECISION: ${VIENEU_PRECISION}
      VIENEU_THREADS: ${VIENEU_THREADS}
      VIENEU_BATCH_MAX_SEGMENTS: ${VIENEU_BATCH_MAX_SEGMENTS}
      VIENEU_MAX_BATCH_SIZE: ${VIENEU_MAX_BATCH_SIZE}
      VIENEU_INFERENCE_CONCURRENCY: ${VIENEU_INFERENCE_CONCURRENCY}
      VIENEU_DENOISE_REFERENCE: ${VIENEU_DENOISE_REFERENCE}
      VIENEU_SAVE_VOICE_PROFILE: ${VIENEU_SAVE_VOICE_PROFILE}
      VIENEU_FORCE_REENROLL: ${VIENEU_FORCE_REENROLL}
      VIENEU_APPLY_WATERMARK: ${VIENEU_APPLY_WATERMARK}
      MEDIA_STORAGE_MODE: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
    volumes:
      - type: bind
        source: ${VIENEU_REFERENCE_AUDIO_FILE}
        target: /run/narrativex/voices/reference.wav
        read_only: true
        bind:
          create_host_path: false
      - vieneu-home:/home/appuser
    depends_on:
      backend: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [appnet]

  render-worker:
    image: ${RENDER_WORKER_IMAGE:-narrativex-render-worker}:${BUILD_SHA:-local}
    build:
      context: ./app/ai-worker
      dockerfile: Dockerfile
      target: worker-render
      args: *build-args
    restart: unless-stopped
    environment:
      <<: *worker-database-environment
      WORKER_NAME: narrativex-prod-render
      WORKER_ENV: production
      WORKER_ROLES: render
      LOG_LEVEL: ${WORKER_LOG_LEVEL}
      BACKEND_URL: http://backend:8080
      BUILD_SHA: ${BUILD_SHA:-local}
      POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS}
      WORKER_CONCURRENCY: ${RENDER_WORKER_CONCURRENCY}
      MEDIA_DOWNLOAD_TIMEOUT_SECONDS: ${MEDIA_DOWNLOAD_TIMEOUT_SECONDS}
      MEDIA_PROBE_TIMEOUT_SECONDS: ${MEDIA_PROBE_TIMEOUT_SECONDS}
      MEDIA_MAX_AUDIO_BYTES: ${MEDIA_MAX_AUDIO_BYTES}
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES}
      AI_PROVIDER_MODE: disabled
      IMAGE_PROVIDER_MODE: disabled
      TTS_PROVIDER_MODE: disabled
      MEDIA_STORAGE_MODE: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID}
      GOOGLE_DRIVE_TIMEOUT_SECONDS: ${GOOGLE_DRIVE_TIMEOUT_SECONDS}
    depends_on:
      backend: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [appnet]

  cloudflared:
    profiles: ["tunnel"]
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.8.2}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env before enabling the tunnel profile}
    depends_on:
      backend: { condition: service_healthy }
    networks: [appnet]

networks:
  appnet: { driver: bridge }
volumes:
  postgres-data:
  redis-data:
  vieneu-home:
