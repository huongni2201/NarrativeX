spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

narrativex:
  compute:
    machine-token: ${NARRATIVEX_COMPUTE_MACHINE_TOKEN}
    callback-secret: ${NARRATIVEX_COMPUTE_CALLBACK_SECRET:${NARRATIVEX_COMPUTE_MACHINE_TOKEN}}
