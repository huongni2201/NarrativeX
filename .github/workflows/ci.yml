name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    if: false
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - run: echo diagnostic-only

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml

      - name: Verify
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee backend-verify.log

      - name: Upload backend verify diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-verify-log
          path: app/backend-service/backend-verify.log
          if-no-files-found: warn

  ai-worker:
    if: false
    name: AI worker checks
    runs-on: ubuntu-latest
    steps:
      - run: echo diagnostic-only

  desktop:
    if: false
    name: Desktop check
    runs-on: ubuntu-latest
    steps:
      - run: echo diagnostic-only
