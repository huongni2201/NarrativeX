name: Remove image billing

on:
  push:
    branches:
      - fix/audit-runtime-races-and-remove-image-billing
    paths:
      - scripts/remove-image-billing.py
      - .github/workflows/remove-image-billing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-runtime-races-and-remove-image-billing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fix temporary patcher for shared usage helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/remove-image-billing.py')
          text = p.read_text()
          old = "for p in ['app/ai-worker/src/narrativex_worker/providers/vertex_image.py','app/ai-worker/src/narrativex_worker/providers/vertex_image_batch.py']:\n    t=read(p)\n    t=t.replace('            _usage(raw),\\n            None,\\n','').replace('        _usage(raw),\\n        None,\\n','')\n    t,n=re.subn(r'\\n\\ndef _usage\\(raw: dict\\[str, object\\]\\) -> dict\\[str, int \\| str\\]:.*?(?=\\n\\ndef |\\Z)', '', t, count=1, flags=re.S)\n    if n!=1: raise RuntimeError(f'{p}: _usage helper not found')\n    write(p,t)"
          new = "p='app/ai-worker/src/narrativex_worker/providers/vertex_image.py'\nt=read(p).replace('            _usage(raw),\\n            None,\\n','')\nt,n=re.subn(r'\\n\\ndef _usage\\(raw: dict\\[str, object\\]\\) -> dict\\[str, int \\| str\\]:.*?(?=\\n\\ndef |\\Z)', '', t, count=1, flags=re.S)\nif n!=1: raise RuntimeError(f'{p}: _usage helper not found')\nwrite(p,t)\np='app/ai-worker/src/narrativex_worker/providers/vertex_image_batch.py'\nt=read(p).replace('    _usage,\\n','').replace('        _usage(raw),\\n        None,\\n','')\nwrite(p,t)"
          if old not in text:
              raise SystemExit('temporary patch target not found')
          p.write_text(text.replace(old, new))
          PY
      - name: Remove image billing paths
        run: python scripts/remove-image-billing.py
      - name: Validate removal shape
        run: |
          ! grep -R 'NARRATIVEX_IMAGE_UNIT_COST\|NARRATIVEX_IMAGE_PRICING_VERSION' docker-compose.yml .env.example app/backend-service/src/main/resources/application.yml
          ! grep -R 'MediaJobCostEstimate\|useEstimateMediaJob' packages/client-contracts/src app/desktop/src/renderer/features/generation
          ! grep -R 'actual_cost\|usage:' app/ai-worker/src/narrativex_worker/providers/image.py
          ! grep -R '_usage(raw)' app/ai-worker/src/narrativex_worker/providers/vertex_image.py app/ai-worker/src/narrativex_worker/providers/vertex_image_batch.py
      - name: Remove temporary patcher and commit
        run: |
          git rm -f scripts/remove-image-billing.py .github/workflows/remove-image-billing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove image cost and usage tracking'
          git push origin HEAD:fix/audit-runtime-races-and-remove-image-billing
