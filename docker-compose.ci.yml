name: narrativex-ci

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-narrativex}
      POSTGRES_USER: ${DB_USERNAME:-narrativex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-ci-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-ci-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-narrativex} -d ${DB_NAME:-narrativex}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-ci-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: { context: ./app/backend-service, dockerfile: Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: test
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-narrativex}
      DB_USERNAME: ${DB_USERNAME:-narrativex}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-ci-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NARRATIVEX_OIDC_ENABLED: "false"
      NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED: "false"
      NARRATIVEX_MEDIA_GENERATION_ENABLED: ${NARRATIVEX_MEDIA_GENERATION_ENABLED:-true}
      FINAL_VIDEO_STORAGE_MODE: local
      FINAL_VIDEO_LOCAL_DIR: /tmp/narrativex-e2e/final
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./.runtime/e2e:/tmp/narrativex-e2e"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ai-worker:
    build: { context: ./app/ai-worker, dockerfile: Dockerfile }
    environment:
      WORKER_NAME: narrativex-ci-worker
      WORKER_ENV: test
      WORKER_ROLES: ${WORKER_ROLES:-analysis,narration,image-generation,render}
      LOG_LEVEL: ${WORKER_LOG_LEVEL:-INFO}
      BACKEND_URL: http://backend:8080
      DATABASE_URL: postgresql://${DB_USERNAME:-narrativex}:${DB_PASSWORD:-change-me-ci-only}@postgres:5432/${DB_NAME:-narrativex}
      POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
      LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-disabled}
      IMAGE_PROVIDER_MODE: ${IMAGE_PROVIDER_MODE:-disabled}
      TTS_PROVIDER_MODE: ${TTS_PROVIDER_MODE:-disabled}
      MEDIA_STORAGE_MODE: ${MEDIA_STORAGE_MODE:-disabled}
      MEDIA_LOCAL_DIR: ${MEDIA_LOCAL_DIR:-/tmp/narrativex-e2e/media}
      FINAL_VIDEO_STORAGE_MODE: ${FINAL_VIDEO_STORAGE_MODE:-local}
      FINAL_VIDEO_LOCAL_DIR: ${FINAL_VIDEO_LOCAL_DIR:-/tmp/narrativex-e2e/final}
    volumes: ["./.runtime/e2e:/tmp/narrativex-e2e"]
    depends_on:
      backend: { condition: service_healthy }
      postgres: { condition: service_healthy }

volumes:
  postgres-ci-data:
  redis-ci-data:
