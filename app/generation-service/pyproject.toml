[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "narrativex-gpu-worker"
version = "0.1.0"
description = "Domain-agnostic NarrativeX compute execution plane"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.53.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]
narration = [
    "ctranslate2==4.8.2",
    "numpy==2.5.3",
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "vieneu==3.8.1",
    "whisperx==3.8.6",
]
image = [
    "Pillow==12.3.0",
]

[tool.uv]
override-dependencies = [
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "torchcodec==0.16.0",
    "torchvision==0.29.0",
]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
whisperx = { git = "https://github.com/m-bain/whisperX.git", tag = "v3.8.6" }
vieneu = { git = "https://github.com/pnnbao97/VieNeu-TTS.git", rev = "592ba27c8f932b80768f6cee405badaef32bdb17" }

[project.scripts]
narrativex-gpu-worker = "narrativex_gpu_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/narrativex_gpu_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"

