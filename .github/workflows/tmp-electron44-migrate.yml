name: Temporary Electron 44 migration

on:
  push:
    branches:
      - chore/update-all-dependencies-2026-08-31

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/update-all-dependencies-2026-08-31
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Verify regression test fails before migration
        working-directory: app/desktop
        run: |
          if node --experimental-strip-types --experimental-transform-types --test test/prompt-copy-contract.test.mjs; then
            echo "Expected Electron 44 clipboard contract test to fail before migration."
            exit 1
          fi

      - name: Migrate Electron 44 clipboard API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/desktop/src/main/main.ts')
          text = path.read_text()
          old = '''  registerTrustedIpcHandler("desktop:system:clipboard-write", trustPolicy, (text) => {
            if (typeof text !== "string" || text.length > 200_000) {
              throw new Error("Invalid clipboard text.");
            }
            clipboard.writeText(text);
          });'''
          new = '''  registerTrustedIpcHandler("desktop:system:clipboard-write", trustPolicy, async (text) => {
            if (typeof text !== "string" || text.length > 200_000) {
              throw new Error("Invalid clipboard text.");
            }
            await clipboard.writeText(text);
          });'''
          if old not in text:
              raise SystemExit('clipboard handler pattern not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Update Electron and regenerate lockfile
        working-directory: app/desktop
        run: npm install electron@^44.0.0 --save --package-lock-only

      - name: Install dependencies
        working-directory: app/desktop
        run: npm ci

      - name: Verify Desktop
        working-directory: app/desktop
        run: npm run check

      - name: Commit migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/desktop/package.json app/desktop/package-lock.json app/desktop/src/main/main.ts
          git commit -m "chore(desktop): upgrade Electron to 44" || exit 0
          git push origin HEAD:chore/update-all-dependencies-2026-08-31
