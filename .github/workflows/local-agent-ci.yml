name: Local Agent CI

on:
  pull_request:
    paths:
      - "tools/local-agent/**"
      - ".github/workflows/local-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "tools/local-agent/**"
      - ".github/workflows/local-agent-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/local-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
