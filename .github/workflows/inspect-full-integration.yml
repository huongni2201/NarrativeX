name: Inspect Full Integration

on:
  push:
    branches:
      - agent/full-api-runtime-integration
    paths:
      - '.github/workflows/inspect-full-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect backend and frontend integration surface
        shell: bash
        run: |
          set -euo pipefail
          echo '=== X-User-Id ==='
          grep -RIn --exclude-dir=target --exclude-dir=node_modules 'X-User-Id' app documentation . || true
          echo '=== ownerId in API/application ==='
          grep -RIn --include='*.java' 'ownerId' app/backend-service/src/main/java/com/narrativex/backend/feature | head -n 250 || true
          echo '=== frontend mock references ==='
          grep -RIn --include='*.ts' --include='*.tsx' -E 'mock-data|isMockDataMode|DATA_MODE|MOCK_' app/frontend-web/src | head -n 400 || true
          echo '=== listProjects consumers ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'listProjects\|projectsApi.list\|projectsPage' app/frontend-web/src || true
          echo '=== backend feature trees ==='
          find app/backend-service/src/main/java/com/narrativex/backend/feature/{project,character,storyboard,generation} -type f | sort
          echo '=== character repository/usecases ==='
          find app/backend-service/src/main/java/com/narrativex/backend/feature/character -type f -maxdepth 8 -print | sort
          echo '=== storyboard files ==='
          find app/backend-service/src/main/java/com/narrativex/backend/feature/storyboard -type f -print | sort
          echo '=== generation redis/queue ==='
          grep -RIn --include='*.java' -E 'Redis|queue|publish|GenerationJob|OperationPlan' app/backend-service/src/main/java/com/narrativex/backend/feature/generation | head -n 350 || true
          echo '=== worker ==='
          find app/ai-worker/src app/ai-worker/tests -type f -print | sort
          echo '=== frontend project/character/storyboard files ==='
          find app/frontend-web/src/features -type f \( -path '*/projects/*' -o -path '*/dashboard/*' -o -path '*/characters/*' -o -path '*/production/*' -o -path '*/project-creation/*' -o -path '*/storyboard/*' \) -print | sort
