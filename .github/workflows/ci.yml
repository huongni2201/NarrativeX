name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    if: false
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - run: echo diagnostic-only

  backend:
    if: false
    name: Backend verify
    runs-on: ubuntu-latest
    steps:
      - run: echo diagnostic-only

  ai-worker:
    name: AI worker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ai-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/ai-worker/pyproject.toml

      - name: Install worker and CI dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: Ruff
        run: python -m ruff check src tests

      - name: Mypy
        run: |
          set -o pipefail
          python -m mypy src 2>&1 | tee mypy-check.log

      - name: Upload Mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-worker-mypy-log
          path: app/ai-worker/mypy-check.log
          if-no-files-found: warn

  desktop:
    if: false
    name: Desktop check
    runs-on: ubuntu-latest
    steps:
      - run: echo diagnostic-only
