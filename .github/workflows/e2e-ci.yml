name: MVP E2E

on:
  push:
    branches: [main]
    paths:
      - "app/backend-service/**"
      - "app/ai-worker/**"
      - "app/frontend-web/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/backend-service/**"
      - "app/ai-worker/**"
      - "app/frontend-web/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvp-e2e:
    name: MVP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_NAME: narrativex
      DB_USERNAME: narrativex
      DB_PASSWORD: change-me-local-only
      NARRATIVEX_MEDIA_GENERATION_ENABLED: "true"
      NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED: "false"
      AI_PROVIDER_MODE: fake
      IMAGE_PROVIDER_MODE: fake
      TTS_PROVIDER_MODE: fake
      MEDIA_STORAGE_MODE: local
      MEDIA_LOCAL_DIR: /tmp/narrativex-e2e/media
      FINAL_VIDEO_STORAGE_MODE: local
      FINAL_VIDEO_LOCAL_DIR: /tmp/narrativex-e2e/final
      WORKER_ROLES: analysis,narration,image-generation,render
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_FULL_FLOW: "true"
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend-web/package-lock.json

      - name: Install FFmpeg and verify toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          java -version
          python --version
          node --version
          ffmpeg -version

      - name: Require out-of-band E2E credentials
        run: test -n "$E2E_TEST_EMAIL" && test -n "$E2E_TEST_PASSWORD"

      - name: Start PostgreSQL and Redis
        run: |
          mkdir -p .runtime/e2e
          docker compose up -d postgres redis

      - name: Start backend and real worker with fake external providers
        run: docker compose up -d --build backend ai-worker

      - name: Install frontend dependencies and start frontend
        working-directory: app/frontend-web
        run: |
          npm ci
          npm run build
          npm run start -- -H 0.0.0.0 > ../../.runtime/e2e/frontend.log 2>&1 &

      - name: Wait for service health
        run: |
          for url in http://127.0.0.1:8080/actuator/health http://127.0.0.1:3000/auth; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$url" > /dev/null; then break; fi
              test "$attempt" -eq 60 && exit 1
              sleep 2
            done
          done

      - name: Install Playwright Chromium
        working-directory: app/frontend-web
        run: npx playwright install --with-deps chromium

      - name: Run full Playwright E2E
        working-directory: app/frontend-web
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mvp-e2e-playwright-evidence
          path: |
            app/frontend-web/test-results/
            app/frontend-web/playwright-report/
            .runtime/e2e/frontend.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload service logs
        if: always()
        run: docker compose logs --no-color > .runtime/e2e/docker-compose.log

      - name: Upload service logs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mvp-e2e-service-logs
          path: .runtime/e2e/docker-compose.log
          if-no-files-found: warn
          retention-days: 14
