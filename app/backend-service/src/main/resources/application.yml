spring:
  application:
    name: NarrativeX Backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:narrativex}
    username: ${DB_USERNAME:narrativex}
    password: ${DB_PASSWORD:narrativex}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    timeout: ${NARRATIVEX_SESSION_TIMEOUT:7d}
    data:
      redis:
        namespace: ${NARRATIVEX_SESSION_REDIS_NAMESPACE:narrativex:session}
        flush-mode: on-save
  servlet:
    multipart:
      max-file-size: ${NARRATIVEX_MAX_IMPORT_FILE_SIZE:10MB}
      max-request-size: ${NARRATIVEX_MAX_IMPORT_REQUEST_SIZE:11MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mybatis/*.xml
  type-handlers-package: com.narrativex.backend.feature.assets.infrastructure.persistence.mybatis
  configuration:
    map-underscore-to-camel-case: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: NX_SESSION
        http-only: true
        secure: true
        same-site: lax

narrativex:
  generation:
    media-enabled: ${NARRATIVEX_MEDIA_GENERATION_ENABLED:false}
    image:
      provider-key: ${NARRATIVEX_IMAGE_PROVIDER_KEY:vertex}
      model: ${NARRATIVEX_IMAGE_MODEL:gemini-2.5-flash-image}
      pricing-version: ${NARRATIVEX_IMAGE_PRICING_VERSION:gemini-2.5-flash-image-batch-2026-08-22}
      execution-mode: ${NARRATIVEX_IMAGE_EXECUTION_MODE:BATCH}
  limits:
    max-story-characters: ${NARRATIVEX_MAX_STORY_CHARACTERS:500000}
    max-estimated-input-tokens: ${NARRATIVEX_MAX_ESTIMATED_INPUT_TOKENS:120000}
  security:
    oidc-enabled: ${NARRATIVEX_OIDC_ENABLED:false}
    local-user-id: ${NARRATIVEX_LOCAL_USER_ID:local-dev-user}
    local-dev-identity-enabled: ${NARRATIVEX_LOCAL_DEV_IDENTITY_ENABLED:false}
    frontend-base-url: ${NARRATIVEX_FRONTEND_BASE_URL:http://localhost:3000}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    cors:
      allowed-origins: ${NARRATIVEX_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  providers:
    vertex-gemini:
      enabled: ${VERTEX_GEMINI_ENABLED:false}
      project-id: ${GOOGLE_CLOUD_PROJECT:}
      location: ${VERTEX_LOCATION:us-central1}
      model: ${VERTEX_GEMINI_MODEL:gemini-2.5-flash}
  storage:
    final-video-mode: ${FINAL_VIDEO_STORAGE_MODE:google-drive}
    final-video-local-dir: ${FINAL_VIDEO_LOCAL_DIR:/tmp/narrativex-e2e/final}
    upload-intent-ttl: ${NARRATIVEX_STORAGE_UPLOAD_INTENT_TTL:15m}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      endpoint: ${R2_ENDPOINT:}
    google-drive:
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
      timeout-seconds: ${GOOGLE_DRIVE_TIMEOUT_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{correlationId}] - %msg%n"
  level:
    root: INFO
    com.narrativex.backend: INFO
