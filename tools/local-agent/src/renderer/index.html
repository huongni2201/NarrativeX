<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NarrativeX Agent</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: dark; }
    body { margin: 0; background: #0b0f17; color: #f8fafc; }
    main { padding: 28px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo { width: 34px; height: 34px; border-radius: 9px; background: #111827; color: #f97316; display: grid; place-items: center; font-weight: 800; }
    h1 { font-size: 20px; margin: 0; }
    .card { border: 1px solid #263041; background: #111827; border-radius: 14px; padding: 18px; }
    .status { display: flex; justify-content: space-between; margin-bottom: 18px; }
    .muted { color: #94a3b8; font-size: 13px; }
    .value { font-weight: 650; }
    label { display: block; margin: 18px 0 8px; font-size: 13px; color: #cbd5e1; }
    input { box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 9px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; }
    button { margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 9px; background: #f97316; color: #111827; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { min-height: 20px; margin-top: 12px; font-size: 13px; color: #fca5a5; }
    .ready { color: #86efac; }
  </style>
</head>
<body>
<main>
  <div class="brand"><div class="logo">N</div><div><h1>NarrativeX Agent</h1><div class="muted">Local execution node</div></div></div>
  <section class="card">
    <div class="status"><span class="muted">Status</span><span id="status" class="value">Loading…</span></div>
    <div class="status"><span class="muted">Backend</span><span id="backend" class="muted">—</span></div>
    <div id="pairing">
      <label for="pairingCode">Pairing code</label>
      <input id="pairingCode" autocomplete="off" placeholder="NX-XXXX-XXXX" maxlength="12" />
      <button id="pairButton">Connect device</button>
      <div id="message"></div>
    </div>
  </section>
</main>
<script>
  const statusEl = document.getElementById('status');
  const backendEl = document.getElementById('backend');
  const pairingEl = document.getElementById('pairing');
  const codeEl = document.getElementById('pairingCode');
  const buttonEl = document.getElementById('pairButton');
  const messageEl = document.getElementById('message');

  async function refresh() {
    const state = await window.narrativeXAgent.status();
    statusEl.textContent = state.status;
    backendEl.textContent = state.backendBaseUrl;
    pairingEl.style.display = state.status === 'ONLINE' ? 'none' : 'block';
    statusEl.className = state.status === 'ONLINE' ? 'value ready' : 'value';
  }

  buttonEl.addEventListener('click', async () => {
    const code = codeEl.value.trim();
    if (!code) { messageEl.textContent = 'Enter a pairing code.'; return; }
    buttonEl.disabled = true;
    messageEl.textContent = '';
    const result = await window.narrativeXAgent.pair(code);
    buttonEl.disabled = false;
    if (!result.ok) { messageEl.textContent = result.message || 'Pairing failed.'; return; }
    messageEl.textContent = '';
    await refresh();
  });

  void refresh();
</script>
</body>
</html>
