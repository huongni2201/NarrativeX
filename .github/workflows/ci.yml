name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Maven verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  worker:
    name: Worker / lint typecheck tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: narrativex
          POSTGRES_PASSWORD: narrativex
          POSTGRES_DB: narrativex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U narrativex -d narrativex_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DATABASE_URL: postgresql://narrativex:narrativex@127.0.0.1:5432/narrativex_test
    defaults:
      run:
        working-directory: app/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/ai-worker/pyproject.toml
      - name: Install worker
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend / lint typecheck tests build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend-web/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Contract tests
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_NX_DATA_MODE: api
        run: npm run build
