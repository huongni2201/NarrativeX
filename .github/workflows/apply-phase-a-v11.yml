name: Apply Phase A Product Refactor V11

on:
  push:
    branches: [agent/full-api-runtime-integration]
    paths: ['.github/workflows/apply-phase-a-v11.yml']

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-api-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend-web/package-lock.json

      - name: Replay phase A and add project detail files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-phase-a-v8.yml').read_text(encoding='utf-8')
          first = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          first_end = source.index("\n          PY\n", first)
          lines = source[first:first_end].splitlines()
          Path('/tmp/a1.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines), encoding='utf-8')
          second = source.index("          python <<'PY'\n", first_end) + len("          python <<'PY'\n")
          second_end = source.index("\n          PY\n", second)
          lines = source[second:second_end].splitlines()
          Path('/tmp/a2.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines), encoding='utf-8')
          PY
          python /tmp/a1.py
          python /tmp/a2.py

          python <<'PY'
          from pathlib import Path
          import re

          def write(path, content):
              p = Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(content.strip() + '\n', encoding='utf-8')

          pattern = re.compile(r'currentUserId\.resolve\((?:[^()]|\([^()]*\))*\)')
          for path in Path('app/backend-service/src/main/java').rglob('*.java'):
              text = pattern.sub('currentUserId.get()', path.read_text(encoding='utf-8'))
              path.write_text(text, encoding='utf-8')
              if 'currentUserId.resolve(' in text: raise SystemExit('unmigrated identity: ' + str(path))

          write('app/backend-service/src/main/java/com/narrativex/backend/feature/project/application/query/GetProjectQuery.java', '''
          package com.narrativex.backend.feature.project.application.query;
          import com.narrativex.backend.feature.common.domain.exception.DomainValidationException;
          public record GetProjectQuery(Long projectId) {
              public GetProjectQuery {
                  if (projectId == null || projectId <= 0) throw new DomainValidationException("projectId must be positive");
              }
          }
          ''')
          write('app/backend-service/src/main/java/com/narrativex/backend/feature/project/application/usecase/GetProjectUseCase.java', '''
          package com.narrativex.backend.feature.project.application.usecase;
          import com.narrativex.backend.feature.auth.application.port.in.CurrentUserId;
          import com.narrativex.backend.feature.common.exception.ResourceNotFoundException;
          import com.narrativex.backend.feature.common.response.ApiResponse;
          import com.narrativex.backend.feature.project.api.response.ProjectResponse;
          import com.narrativex.backend.feature.project.application.port.out.ProjectRepository;
          import com.narrativex.backend.feature.project.application.query.GetProjectQuery;
          import lombok.RequiredArgsConstructor;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.stereotype.Service;
          import org.springframework.transaction.annotation.Transactional;
          @Slf4j @Service @RequiredArgsConstructor
          public class GetProjectUseCase {
              private final ProjectRepository projectRepository;
              private final CurrentUserId currentUserId;
              @Transactional(readOnly = true)
              public ApiResponse<ProjectResponse> execute(GetProjectQuery query) {
                  String ownerId = currentUserId.get();
                  var project = projectRepository.findOwnedById(query.projectId(), ownerId)
                          .orElseThrow(() -> new ResourceNotFoundException("Project not found"));
                  log.debug("Loaded project {} for authenticated principal", query.projectId());
                  return ApiResponse.success("Project retrieved successfully", ProjectResponse.from(project));
              }
          }
          ''')

          test = Path('app/backend-service/src/test/java/com/narrativex/backend/feature/generation/api/GenerationJobControllerContractTest.java')
          text = test.read_text(encoding='utf-8').replace('new GetGenerationJobQuery("job-1", "owner")', 'new GetGenerationJobQuery("job-1", null)')
          test.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify backend
        working-directory: app/backend-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify frontend
        working-directory: app/frontend-web
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run build

      - name: Commit product code only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app AGENTS.md README.md documentation contracts || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: use security context and real project APIs'
          git push origin HEAD:agent/full-api-runtime-integration
