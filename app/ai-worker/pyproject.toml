[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narrativex-worker"
version = "0.1.0"
description = "NarrativeX AI and media processing asynchronous worker foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.7.0",
    "pydantic-settings==2.2.0",
    "httpx==0.27.0",
    "asyncpg==0.30.0",
    "google-auth[requests]==2.35.0",
]

[project.optional-dependencies]
media = [
    "boto3==1.40.0",
    "Pillow==10.0.0",
]
image = [
    "boto3==1.40.0",
    "Pillow==10.0.0",
]
narration = [
    "boto3==1.40.0",
    "vieneu==3.3.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy==1.26.0",
    "pydub==0.25.1",
]
render = [
    "boto3==1.40.0",
    "Pillow==10.0.0",
    "ffmpeg-python==0.2.0",
]
gpu = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.6",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3==1.40.0",
    "Pillow==10.0.0",
    "vieneu==3.3.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy==1.26.0",
    "pydub==0.25.1",
    "ffmpeg-python==0.2.0",
]

[project.scripts]
narrativex-worker = "narrativex_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/narrativex_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
