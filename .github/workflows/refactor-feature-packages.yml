name: One-shot Feature Package Refactor

on:
  push:
    branches:
      - agent/feature-boundaries-keyset-pagination
    paths:
      - '.github/workflows/refactor-feature-packages.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/feature-boundaries-keyset-pagination
          fetch-depth: 0

      - name: Rename modules package root to feature
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ROOT='app/backend-service/src/main/java/com/narrativex/backend'
          TEST_ROOT='app/backend-service/src/test/java/com/narrativex/backend'

          if [ -d "$MAIN_ROOT/modules" ]; then
            mv "$MAIN_ROOT/modules" "$MAIN_ROOT/feature"
          fi

          if [ -d "$TEST_ROOT/modules" ]; then
            mv "$TEST_ROOT/modules" "$TEST_ROOT/feature"
          fi

          while IFS= read -r -d '' file; do
            sed -i 's/com\.narrativex\.backend\.modules/com.narrativex.backend.feature/g' "$file"
          done < <(grep -RIlZ --exclude-dir=target 'com\.narrativex\.backend\.modules' app/backend-service || true)

          rm -f .github/workflows/refactor-feature-packages.yml

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No refactor changes detected.'
            exit 0
          fi
          git commit -m 'refactor: rename backend modules package to feature'
          git push origin HEAD:agent/feature-boundaries-keyset-pagination
