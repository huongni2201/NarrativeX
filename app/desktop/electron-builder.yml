appId: com.narrativex.desktop
productName: NarrativeX
artifactName: NarrativeX-${version}-${os}-${arch}.${ext}
asar: true
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
protocols:
  - name: NarrativeX authentication callback
    schemes:
      - narrativex
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: NarrativeX
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish: null
