[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "narrativex-gpu-worker"
version = "0.1.0"
description = "Domain-agnostic NarrativeX compute execution plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]
narration = [
    "numpy==1.26.4",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "whisperx==3.8.6",
]
image = [
    "Pillow==12.3.0",
]

[project.scripts]
narrativex-gpu-worker = "narrativex_gpu_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/narrativex_gpu_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

