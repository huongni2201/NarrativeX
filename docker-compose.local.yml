# Local development override.
#
# The production compose file keeps provider credentials and sensitive bind mounts
# explicit. This override lets the Desktop app and worker processes run locally
# without requiring the production GCP credential/reference-audio files.
services:
  backend:
    environment:
      NARRATIVEX_PUBLIC_BASE_URL: ""
      NARRATIVEX_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,null"

  ai-worker:
    environment:
      WORKER_ENV: development
      AI_PROVIDER_MODE: disabled
      IMAGE_PROVIDER_MODE: disabled
      MEDIA_STORAGE_MODE: disabled
    volumes: !reset []

  narration-worker:
    environment:
      WORKER_ENV: development
      TTS_PROVIDER_MODE: fake
      MEDIA_STORAGE_MODE: local
      MEDIA_LOCAL_DIR: /tmp/narrativex/media
    volumes: !reset []

  render-worker:
    environment:
      WORKER_ENV: development
      MEDIA_STORAGE_MODE: local
      MEDIA_LOCAL_DIR: /tmp/narrativex/media
      FINAL_VIDEO_STORAGE_MODE: local
      FINAL_VIDEO_LOCAL_DIR: /tmp/narrativex/final
    volumes: !reset []
