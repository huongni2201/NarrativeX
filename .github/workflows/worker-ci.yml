name: Worker CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/ai-worker/**'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/ai-worker/**'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-test:
    name: Worker / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: narrativex_test
          POSTGRES_USER: narrativex
          POSTGRES_PASSWORD: narrativex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narrativex -d narrativex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://narrativex:narrativex@127.0.0.1:5432/narrativex_test

    defaults:
      run:
        working-directory: app/ai-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/ai-worker/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy src tests

      - name: Test
        run: pytest
