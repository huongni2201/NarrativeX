name: Real Vertex Provider Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_paid_call:
        description: "This makes one small paid Vertex Gemini call"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"
      vertex_project_id:
        description: "Google Cloud project ID"
        required: true
        type: string
      vertex_location:
        description: "Vertex location"
        required: true
        default: "us-central1"
        type: string

permissions:
  contents: read

jobs:
  vertex-smoke:
    if: ${{ inputs.confirm_paid_call == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/ai-worker/pyproject.toml

      - name: Install worker
        run: python -m pip install ./app/ai-worker

      - name: Require service-account secret
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing repository secret GCP_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-service-account.json"
          chmod 600 "$RUNNER_TEMP/gcp-service-account.json"

      - name: Call real Vertex Gemini provider
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-service-account.json
          VERTEX_PROJECT_ID: ${{ inputs.vertex_project_id }}
          VERTEX_LOCATION: ${{ inputs.vertex_location }}
          VERTEX_MODEL: gemini-2.5-flash
        run: python -m narrativex_worker.provider_smoke
