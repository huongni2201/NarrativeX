spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:narrativex-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
    locations:
      - classpath:db/migration
  session:
    jdbc:
      initialize-schema: always

server:
  servlet:
    session:
      cookie:
        secure: false

narrativex:
  storage:
    upload-cleanup-enabled: false
  generation:
    outbox-dispatch-enabled: false
  security:
    local-dev-identity-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
