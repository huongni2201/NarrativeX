name: Patch Phase A Workflow

on:
  push:
    branches:
      - agent/full-api-runtime-integration
    paths:
      - '.github/workflows/patch-phase-a.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-api-runtime-integration
      - name: Patch nested call migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-phase-a.yml')
          text = path.read_text(encoding='utf-8')
          old = "text = re.sub(r'currentUserId\\.resolve\\([^)]*\\)', 'currentUserId.get()', text)"
          new = "text = re.sub(r'currentUserId\\.resolve\\((?:[^()]|\\([^()]*\\))*\\)', 'currentUserId.get()', text)"
          if old not in text:
              raise SystemExit('target regex not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/patch-phase-a.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: fix phase A migration parser'
          git push origin HEAD:agent/full-api-runtime-integration
