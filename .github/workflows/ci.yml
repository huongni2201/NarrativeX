name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    name: Repository gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Secret scan
        run: python scripts/check-secrets.py

      - name: Documentation drift
        run: python scripts/check-docs-drift.py

      - name: Validate Compose configuration
        run: docker compose config --no-interpolate >/dev/null

  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend-service
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml

      - name: Apply backend formatter for repair artifact
        run: |
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          git diff --name-only --diff-filter=ACMRTUXB > spotless-files.txt
          tar -czf spotless-formatted-files.tar.gz -T spotless-files.txt

      - name: Upload backend formatting repair
        uses: actions/upload-artifact@v7
        with:
          name: backend-spotless-repair
          path: |
            app/backend-service/spotless-files.txt
            app/backend-service/spotless-formatted-files.tar.gz
          if-no-files-found: error

      - name: Verify
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee backend-verify.log

      - name: Upload backend verify diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-verify-log
          path: app/backend-service/backend-verify.log
          if-no-files-found: error

  ai-worker:
    name: AI worker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ai-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/ai-worker/pyproject.toml

      - name: Install worker and CI dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: Ruff
        run: |
          set -o pipefail
          python -m ruff check src tests 2>&1 | tee ruff-check.log

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-worker-ruff-log
          path: app/ai-worker/ruff-check.log
          if-no-files-found: warn

      - name: Mypy
        run: python -m mypy src

  desktop:
    name: Desktop check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test, type-check, and build
        run: npm run check
