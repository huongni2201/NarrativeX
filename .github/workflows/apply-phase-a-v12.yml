name: Apply Phase A Product Refactor V12

on:
  push:
    branches: [agent/full-api-runtime-integration]
    paths: ['.github/workflows/apply-phase-a-v12.yml']

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-api-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend-web/package-lock.json

      - name: Apply final phase A product source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          # Reuse frontend/project bulk migration, then explicitly pin final files below.
          source = Path('.github/workflows/apply-phase-a-v8.yml').read_text(encoding='utf-8')
          first = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          first_end = source.index("\n          PY\n", first)
          lines = source[first:first_end].splitlines()
          Path('/tmp/a1.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines), encoding='utf-8')
          second = source.index("          python <<'PY'\n", first_end) + len("          python <<'PY'\n")
          second_end = source.index("\n          PY\n", second)
          lines = source[second:second_end].splitlines()
          Path('/tmp/a2.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines), encoding='utf-8')
          PY
          python /tmp/a1.py
          python /tmp/a2.py

          python <<'PY'
          from pathlib import Path
          import re

          def write(path, content):
              p = Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(content.strip() + '\n', encoding='utf-8')

          write('app/backend-service/src/main/java/com/narrativex/backend/feature/auth/infrastructure/security/SecurityContextCurrentUser.java', '''
          package com.narrativex.backend.feature.auth.infrastructure.security;
          import com.narrativex.backend.feature.auth.api.response.CurrentUserResponse;
          import com.narrativex.backend.feature.auth.application.port.in.CurrentUserId;
          import com.narrativex.backend.feature.auth.application.port.in.CurrentUserProfile;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.security.core.Authentication;
          import org.springframework.security.core.context.SecurityContextHolder;
          import org.springframework.security.oauth2.core.oidc.user.OidcUser;
          import org.springframework.stereotype.Component;
          @Slf4j @Component
          public class SecurityContextCurrentUser implements CurrentUserId, CurrentUserProfile {
              @Override public String get() { return authenticated().getName(); }
              @Override public CurrentUserResponse current() {
                  Authentication authentication = authenticated();
                  String id = authentication.getName();
                  if (authentication.getPrincipal() instanceof OidcUser user) {
                      return new CurrentUserResponse(id, firstNonBlank(user.getFullName(), user.getGivenName(), user.getEmail(), id), user.getEmail(), user.getPicture());
                  }
                  log.debug("Resolved authenticated principal {}", id);
                  return new CurrentUserResponse(id, id, null, null);
              }
              private static Authentication authenticated() {
                  Authentication authentication = SecurityContextHolder.getContext().getAuthentication();
                  if (authentication == null || !authentication.isAuthenticated() || authentication.getName() == null || authentication.getName().isBlank()) {
                      throw new IllegalArgumentException("Authenticated user is required");
                  }
                  return authentication;
              }
              private static String firstNonBlank(String... values) {
                  for (String value : values) if (value != null && !value.isBlank()) return value;
                  return null;
              }
          }
          ''')

          write('app/backend-service/src/main/java/com/narrativex/backend/feature/project/application/query/GetProjectQuery.java', '''
          package com.narrativex.backend.feature.project.application.query;
          import com.narrativex.backend.feature.common.domain.exception.DomainValidationException;
          public record GetProjectQuery(Long projectId) {
              public GetProjectQuery { if (projectId == null || projectId <= 0) throw new DomainValidationException("projectId must be positive"); }
          }
          ''')
          write('app/backend-service/src/main/java/com/narrativex/backend/feature/project/application/usecase/GetProjectUseCase.java', '''
          package com.narrativex.backend.feature.project.application.usecase;
          import com.narrativex.backend.feature.auth.application.port.in.CurrentUserId;
          import com.narrativex.backend.feature.common.exception.ResourceNotFoundException;
          import com.narrativex.backend.feature.common.response.ApiResponse;
          import com.narrativex.backend.feature.project.api.response.ProjectResponse;
          import com.narrativex.backend.feature.project.application.port.out.ProjectRepository;
          import com.narrativex.backend.feature.project.application.query.GetProjectQuery;
          import lombok.RequiredArgsConstructor;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.stereotype.Service;
          import org.springframework.transaction.annotation.Transactional;
          @Slf4j @Service @RequiredArgsConstructor
          public class GetProjectUseCase {
              private final ProjectRepository projectRepository;
              private final CurrentUserId currentUserId;
              @Transactional(readOnly = true)
              public ApiResponse<ProjectResponse> execute(GetProjectQuery query) {
                  var project = projectRepository.findOwnedById(query.projectId(), currentUserId.get())
                          .orElseThrow(() -> new ResourceNotFoundException("Project not found"));
                  log.debug("Loaded project {}", query.projectId());
                  return ApiResponse.success("Project retrieved successfully", ProjectResponse.from(project));
              }
          }
          ''')

          write('app/backend-service/src/main/java/com/narrativex/backend/feature/project/api/controller/ProjectController.java', '''
          package com.narrativex.backend.feature.project.api.controller;
          import com.narrativex.backend.feature.common.pagination.CursorPage;
          import com.narrativex.backend.feature.common.response.ApiResponse;
          import com.narrativex.backend.feature.project.api.request.CreateProjectRequest;
          import com.narrativex.backend.feature.project.api.request.CreateStoryVersionRequest;
          import com.narrativex.backend.feature.project.api.response.ProjectResponse;
          import com.narrativex.backend.feature.project.api.response.StoryVersionResponse;
          import com.narrativex.backend.feature.project.application.command.CreateProjectCommand;
          import com.narrativex.backend.feature.project.application.command.CreateStoryVersionCommand;
          import com.narrativex.backend.feature.project.application.query.GetProjectQuery;
          import com.narrativex.backend.feature.project.application.query.ProjectListQuery;
          import com.narrativex.backend.feature.project.application.usecase.CreateProjectUseCase;
          import com.narrativex.backend.feature.project.application.usecase.CreateStoryVersionUseCase;
          import com.narrativex.backend.feature.project.application.usecase.GetProjectUseCase;
          import com.narrativex.backend.feature.project.application.usecase.ListProjectsUseCase;
          import jakarta.validation.Valid;
          import lombok.RequiredArgsConstructor;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.http.HttpStatus;
          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.*;
          @Slf4j @RestController @RequiredArgsConstructor @RequestMapping("/api/v1/projects")
          public class ProjectController {
              private final ListProjectsUseCase listProjectsUseCase;
              private final GetProjectUseCase getProjectUseCase;
              private final CreateProjectUseCase createProjectUseCase;
              private final CreateStoryVersionUseCase createStoryVersionUseCase;
              @GetMapping public ResponseEntity<ApiResponse<CursorPage<ProjectResponse>>> list(@RequestParam(required=false) String cursor, @RequestParam(defaultValue="20") int limit) {
                  return ResponseEntity.ok(listProjectsUseCase.execute(new ProjectListQuery(null, cursor, limit)));
              }
              @GetMapping("/{projectId}") public ResponseEntity<ApiResponse<ProjectResponse>> get(@PathVariable Long projectId) {
                  return ResponseEntity.ok(getProjectUseCase.execute(new GetProjectQuery(projectId)));
              }
              @PostMapping public ResponseEntity<ApiResponse<ProjectResponse>> create(@Valid @RequestBody CreateProjectRequest request) {
                  var command = new CreateProjectCommand(request.name(), request.sourceLanguage(), request.narrationLanguage(), request.metadataLanguage(), request.imageAspectRatio(), request.imageQualityTier(), null);
                  log.debug("Creating project for authenticated principal");
                  return ResponseEntity.status(HttpStatus.CREATED).body(createProjectUseCase.execute(command));
              }
              @PostMapping("/{projectId}/stories") public ResponseEntity<ApiResponse<StoryVersionResponse>> createStory(@PathVariable Long projectId, @Valid @RequestBody CreateStoryVersionRequest request) {
                  var command = new CreateStoryVersionCommand(projectId, request.content(), request.sourceLanguage(), request.rightsAttestationAccepted(), request.rightsPolicyVersion(), request.rightsBasis(), null);
                  return ResponseEntity.status(HttpStatus.CREATED).body(createStoryVersionUseCase.execute(command));
              }
          }
          ''')

          write('app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/controller/ProjectGenerationController.java', '''
          package com.narrativex.backend.feature.generation.api.controller;
          import com.narrativex.backend.feature.common.response.ApiResponse;
          import com.narrativex.backend.feature.generation.api.response.JobResponse;
          import com.narrativex.backend.feature.generation.application.command.EnqueueStoryAnalysisCommand;
          import com.narrativex.backend.feature.generation.application.usecase.EnqueueStoryAnalysisUseCase;
          import lombok.RequiredArgsConstructor;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.http.*;
          import org.springframework.web.bind.annotation.*;
          @Slf4j @RestController @RequiredArgsConstructor @RequestMapping("/api/v1/projects")
          public class ProjectGenerationController {
              private final EnqueueStoryAnalysisUseCase enqueueStoryAnalysisUseCase;
              @PostMapping("/{projectId}/analysis-jobs") public ResponseEntity<ApiResponse<JobResponse>> analyze(@PathVariable Long projectId) {
                  log.info("Enqueueing story analysis for project {}", projectId);
                  return ResponseEntity.status(HttpStatus.ACCEPTED).body(enqueueStoryAnalysisUseCase.execute(new EnqueueStoryAnalysisCommand(projectId, null)));
              }
          }
          ''')
          write('app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/controller/GenerationJobController.java', '''
          package com.narrativex.backend.feature.generation.api.controller;
          import com.narrativex.backend.feature.common.response.ApiResponse;
          import com.narrativex.backend.feature.generation.api.response.JobResponse;
          import com.narrativex.backend.feature.generation.application.query.GetGenerationJobQuery;
          import com.narrativex.backend.feature.generation.application.usecase.GetGenerationJobUseCase;
          import lombok.RequiredArgsConstructor;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.*;
          @Slf4j @RestController @RequiredArgsConstructor @RequestMapping("/api/v1/jobs")
          public class GenerationJobController {
              private final GetGenerationJobUseCase getGenerationJobUseCase;
              @GetMapping("/{jobId}") public ResponseEntity<ApiResponse<JobResponse>> get(@PathVariable String jobId) {
                  return ResponseEntity.ok(getGenerationJobUseCase.execute(new GetGenerationJobQuery(jobId, null)));
              }
          }
          ''')

          pattern = re.compile(r'currentUserId\.resolve\((?:[^()]|\([^()]*\))*\)')
          for path in Path('app/backend-service/src/main/java').rglob('*.java'):
              text = pattern.sub('currentUserId.get()', path.read_text(encoding='utf-8'))
              path.write_text(text, encoding='utf-8')
              if 'currentUserId.resolve(' in text: raise SystemExit('unmigrated: ' + str(path))

          # Every test double now implements CurrentUserId#get().
          for path in Path('app/backend-service/src/test/java').rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'CurrentUserId currentUserId = [A-Za-z_][A-Za-z0-9_]* -> [^;]+;', 'CurrentUserId currentUserId = () -> "owner";', text)
              path.write_text(text, encoding='utf-8')

          domain = Path('app/backend-service/src/test/java/com/narrativex/backend/DomainFoundationTests.java')
          text = domain.read_text(encoding='utf-8')
          text = text.replace('new SecurityContextCurrentUser(true, "local-user").resolve("attacker")', 'new SecurityContextCurrentUser().get()')
          text = text.replace('new SecurityContextCurrentUser(true, "local-user").get()', 'new SecurityContextCurrentUser().get()')
          domain.write_text(text, encoding='utf-8')

          gen = Path('app/backend-service/src/test/java/com/narrativex/backend/feature/generation/api/GenerationJobControllerContractTest.java')
          text = gen.read_text(encoding='utf-8').replace('new GetGenerationJobQuery("job-1", "owner")', 'new GetGenerationJobQuery("job-1", null)')
          gen.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify backend
        working-directory: app/backend-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify frontend
        working-directory: app/frontend-web
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run build

      - name: Commit product code only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app AGENTS.md README.md documentation contracts || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: use security context and real project APIs'
          git push origin HEAD:agent/full-api-runtime-integration
