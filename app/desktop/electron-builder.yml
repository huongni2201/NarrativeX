appId: com.narrativex.desktop
productName: NarrativeX
directories:
  output: release
files:
  - out/**
  - resources/**
  - "!resources/ffmpeg/**"
extraResources:
  - from: resources/ffmpeg
    to: ffmpeg
win:
  icon: resources/narrativex-icon.png
  target: nsis
  artifactName: NarrativeX-Desktop-${version}.${ext}
protocols:
  - name: NarrativeX Authentication
    schemes:
      - narrativex
