name: Replay Feature Refactor

on:
  push:
    branches:
      - agent/feature-boundaries-keyset-pagination-v2
    paths:
      - '.github/workflows/replay-feature-refactor.yml'

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v7
        with:
          ref: agent/feature-boundaries-keyset-pagination-v2
          fetch-depth: 0

      - name: Replay backend refactor without overwriting newer frontend architecture
        shell: bash
        run: |
          set -euo pipefail
          OLD='origin/agent/feature-boundaries-keyset-pagination'
          git fetch origin agent/feature-boundaries-keyset-pagination

          MAIN_ROOT='app/backend-service/src/main/java/com/narrativex/backend'
          TEST_ROOT='app/backend-service/src/test/java/com/narrativex/backend'

          if [ -d "$MAIN_ROOT/modules" ]; then mv "$MAIN_ROOT/modules" "$MAIN_ROOT/feature"; fi
          if [ -d "$TEST_ROOT/modules" ]; then mv "$TEST_ROOT/modules" "$TEST_ROOT/feature"; fi

          while IFS= read -r -d '' file; do
            sed -i 's/com\.narrativex\.backend\.modules/com.narrativex.backend.feature/g' "$file"
          done < <(grep -RIlZ --exclude-dir=target 'com\.narrativex\.backend\.modules' app/backend-service || true)

          files=(
            'app/backend-service/src/main/java/com/narrativex/backend/feature/common/pagination/CursorKey.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/common/pagination/CursorCodec.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/common/pagination/CursorPage.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/common/domain/exception/DomainException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/common/domain/exception/DomainValidationException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/common/domain/exception/DomainConflictException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/common/api/ApiExceptionHandler.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/api/controller/ProjectController.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/application/query/ProjectListQuery.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/application/port/out/ProjectRepository.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/application/usecase/ListProjectsUseCase.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/infrastructure/persistence/repository/ProjectJpaRepository.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/infrastructure/persistence/adapter/ProjectPersistenceAdapter.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/domain/aggregate/Project.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/domain/exception/ArchivedProjectException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/project/domain/exception/ProjectPersistenceRequiredException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/controller/ProjectGenerationController.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/character/domain/aggregate/Character.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/character/domain/entity/CharacterVersion.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/character/domain/exception/ArchivedCharacterException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/character/domain/exception/CharacterPersistenceRequiredException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/character/domain/exception/InvalidCharacterVersionTransitionException.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/storyboard/domain/entity/VisualBeat.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/storyboard/domain/enums/AspectRatio.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/storyboard/domain/enums/ImageQualityTier.java'
            'app/backend-service/src/main/java/com/narrativex/backend/feature/storyboard/infrastructure/persistence/entity/VisualBeatJpaEntity.java'
            'app/backend-service/src/main/resources/db/migration/V6__project_keyset_pagination.sql'
            'app/backend-service/src/test/java/com/narrativex/backend/architecture/ArchitectureRulesTest.java'
            'app/backend-service/src/test/java/com/narrativex/backend/feature/project/api/ProjectControllerContractTest.java'
            'app/backend-service/src/test/java/com/narrativex/backend/feature/project/domain/ProjectAggregateTest.java'
            'app/backend-service/src/test/java/com/narrativex/backend/feature/generation/api/GenerationJobControllerContractTest.java'
            'app/frontend-web/src/types/api.ts'
            'documentation/codebase/BACKEND_CODEBASE.md'
            'documentation/decisions/ADR-0012-feature-boundaries-and-keyset-pagination.md'
            'documentation/decisions/README.md'
          )

          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "$OLD:$path" > "$path"
          done

          rm -f .github/workflows/replay-feature-refactor.yml

      - name: Commit replay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: establish extraction-ready feature boundaries'
          git push origin HEAD:agent/feature-boundaries-keyset-pagination-v2
