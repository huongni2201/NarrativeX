name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/backend-service/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/backend-service/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend / Java 25 / Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app/backend-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Apply Spotless formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/post-merge-chapter-analysis-ci'
        run: ./mvnw --batch-mode --no-transfer-progress spotless:apply

      - name: Commit Spotless formatting
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/post-merge-chapter-analysis-ci'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(backend): apply Spotless formatting"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
