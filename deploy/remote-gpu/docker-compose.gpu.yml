services:
  generation-service:
    build:
      context: ../../app/generation-service
      dockerfile: Dockerfile
    image: narrativex/generation-service:0.1.0
    container_name: narrativex-gpu-generation-service
    restart: unless-stopped
    ports:
      - "${GENERATION_SERVICE_PORT:-8010}:8010"
    environment:
      - GENERATION_SERVICE_MACHINE_TOKEN=${GENERATION_SERVICE_MACHINE_TOKEN:?Set GENERATION_SERVICE_MACHINE_TOKEN in environment}
      - GENERATION_SERVICE_HOST=0.0.0.0
      - GENERATION_SERVICE_PORT=8010
      - GENERATION_SERVICE_JOURNAL_FILE=/data/generation-service.sqlite3
      - GENERATION_SERVICE_LOG_LEVEL=${GENERATION_SERVICE_LOG_LEVEL:-INFO}
      - GENERATION_SERVICE_RESIDENCY_ENABLED=true
      - GENERATION_SERVICE_RESIDENCY_TIMEOUT_SECONDS=${GENERATION_SERVICE_RESIDENCY_TIMEOUT_SECONDS:-30}
      - GENERATION_SERVICE_RESIDENCY_MAX_VRAM_IDLE_MB=${GENERATION_SERVICE_RESIDENCY_MAX_VRAM_IDLE_MB:-1500}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${MODELS_CACHE_DIR:-./data/models}:/models
      - ${OUTPUTS_CACHE_DIR:-./data/outputs}:/outputs
      - ${JOURNAL_DIR:-./data/journal}:/data
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=4).read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
