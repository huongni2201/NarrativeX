name: Fix Backend Test Imports

on:
  push:
    branches:
      - agent/feature-boundaries-keyset-pagination-v2
    paths:
      - '.github/workflows/fix-backend-test-imports.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/feature-boundaries-keyset-pagination-v2
      - name: Update stale domain test imports
        shell: bash
        run: |
          set -euo pipefail
          root='app/backend-service/src/test/java'
          while IFS= read -r -d '' file; do
            sed -i \
              -e 's/com\.narrativex\.backend\.feature\.project\.domain\.aggregate\.StoryVersion/com.narrativex.backend.feature.project.domain.entity.StoryVersion/g' \
              -e 's/com\.narrativex\.backend\.feature\.character\.domain\.aggregate\.enums/com.narrativex.backend.feature.character.domain.enums/g' \
              -e 's/com\.narrativex\.backend\.feature\.character\.domain\.aggregate\.CharacterAppearance/com.narrativex.backend.feature.character.domain.entity.CharacterAppearance/g' \
              -e 's/com\.narrativex\.backend\.feature\.character\.domain\.aggregate\.CharacterVersion/com.narrativex.backend.feature.character.domain.entity.CharacterVersion/g' \
              -e 's/com\.narrativex\.backend\.feature\.character\.domain\.aggregate\.OutfitVersion/com.narrativex.backend.feature.character.domain.entity.OutfitVersion/g' \
              -e 's/com\.narrativex\.backend\.feature\.generation\.domain\.aggregate\.JobType/com.narrativex.backend.feature.generation.domain.enums.JobType/g' \
              -e 's/com\.narrativex\.backend\.feature\.generation\.domain\.aggregate\.ResourceClass/com.narrativex.backend.feature.generation.domain.enums.ResourceClass/g' \
              -e 's/com\.narrativex\.backend\.shared\.exception/com.narrativex.backend.feature.common.exception/g' \
              "$file"
          done < <(find "$root" -type f -name '*.java' -print0)
          rm -f .github/workflows/fix-backend-test-imports.yml
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align imports with feature domain layout'
          git push origin HEAD:agent/feature-boundaries-keyset-pagination-v2
