name: Apply Phase A Product Refactor V8

on:
  push:
    branches: [agent/full-api-runtime-integration]
    paths: ['.github/workflows/apply-phase-a-v8.yml']

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/full-api-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/backend-service/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend-web/package-lock.json

      - name: Apply product transformation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-phase-a-v3.yml').read_text(encoding='utf-8')
          start = source.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          Path('/tmp/phase_a.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines), encoding='utf-8')
          PY
          python /tmp/phase_a.py

          python <<'PY'
          from pathlib import Path
          import re

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + '\n', encoding='utf-8')

          write('app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/controller/ProjectGenerationController.java', '''
          package com.narrativex.backend.feature.generation.api.controller;
          import com.narrativex.backend.feature.common.response.ApiResponse;
          import com.narrativex.backend.feature.generation.api.response.JobResponse;
          import com.narrativex.backend.feature.generation.application.command.EnqueueStoryAnalysisCommand;
          import com.narrativex.backend.feature.generation.application.usecase.EnqueueStoryAnalysisUseCase;
          import lombok.RequiredArgsConstructor;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.http.HttpStatus;
          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.PathVariable;
          import org.springframework.web.bind.annotation.PostMapping;
          import org.springframework.web.bind.annotation.RequestMapping;
          import org.springframework.web.bind.annotation.RestController;
          @Slf4j @RestController @RequiredArgsConstructor @RequestMapping("/api/v1/projects")
          public class ProjectGenerationController {
              private final EnqueueStoryAnalysisUseCase enqueueStoryAnalysisUseCase;
              @PostMapping("/{projectId}/analysis-jobs")
              public ResponseEntity<ApiResponse<JobResponse>> analyze(@PathVariable Long projectId) {
                  log.info("Enqueueing story analysis for project {}", projectId);
                  return ResponseEntity.status(HttpStatus.ACCEPTED).body(
                      enqueueStoryAnalysisUseCase.execute(new EnqueueStoryAnalysisCommand(projectId, null)));
              }
          }
          ''')
          write('app/backend-service/src/main/java/com/narrativex/backend/feature/generation/api/controller/GenerationJobController.java', '''
          package com.narrativex.backend.feature.generation.api.controller;
          import com.narrativex.backend.feature.common.response.ApiResponse;
          import com.narrativex.backend.feature.generation.api.response.JobResponse;
          import com.narrativex.backend.feature.generation.application.query.GetGenerationJobQuery;
          import com.narrativex.backend.feature.generation.application.usecase.GetGenerationJobUseCase;
          import lombok.RequiredArgsConstructor;
          import lombok.extern.slf4j.Slf4j;
          import org.springframework.http.ResponseEntity;
          import org.springframework.web.bind.annotation.GetMapping;
          import org.springframework.web.bind.annotation.PathVariable;
          import org.springframework.web.bind.annotation.RequestMapping;
          import org.springframework.web.bind.annotation.RestController;
          @Slf4j @RestController @RequiredArgsConstructor @RequestMapping("/api/v1/jobs")
          public class GenerationJobController {
              private final GetGenerationJobUseCase getGenerationJobUseCase;
              @GetMapping("/{jobId}")
              public ResponseEntity<ApiResponse<JobResponse>> get(@PathVariable String jobId) {
                  log.debug("Loading generation job {}", jobId);
                  return ResponseEntity.ok(getGenerationJobUseCase.execute(new GetGenerationJobQuery(jobId, null)));
              }
          }
          ''')

          for rel in [
              'app/backend-service/src/main/java/com/narrativex/backend/feature/character/application/usecase/LockCharacterVersionUseCase.java',
              'app/backend-service/src/main/java/com/narrativex/backend/feature/character/application/usecase/SubmitCharacterVersionForReviewUseCase.java',
          ]:
              p = Path(rel)
              text = p.read_text(encoding='utf-8').replace('currentUserId.resolve(command.actorId())', 'currentUserId.get()')
              p.write_text(text, encoding='utf-8')

          # Fix zero-argument CurrentUserId test doubles generated by the legacy migration.
          for p in Path('app/backend-service/src/test/java').rglob('*.java'):
              text = p.read_text(encoding='utf-8')
              text = text.replace('() -> requested == null ? "local-dev-user" : requested', '() -> "owner"')
              text = text.replace('() -> ownerId == null ? "local-dev-user" : ownerId', '() -> "owner"')
              text = text.replace('() -> value == null ? "local-dev-user" : value', '() -> "owner"')
              p.write_text(text, encoding='utf-8')

          # Domain foundation asserts that the principal is taken from SecurityContextHolder only.
          p = Path('app/backend-service/src/test/java/com/narrativex/backend/DomainFoundationTests.java')
          text = p.read_text(encoding='utf-8')
          text = text.replace('new SecurityContextCurrentUser(true, "local-user").resolve("attacker")', 'new SecurityContextCurrentUser().get()')
          text = text.replace('void oidcIdentityWinsOverClientHeader()', 'void identityComesFromSecurityContext()')
          p.write_text(text, encoding='utf-8')

          # Generation controller contract no longer accepts an owner header.
          p = Path('app/backend-service/src/test/java/com/narrativex/backend/feature/generation/api/GenerationJobControllerContractTest.java')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'controller\.get\(("[^"]+"),\s*"[^"]+"\)', r'controller.get(\1)', text)
          p.write_text(text, encoding='utf-8')

          # Project controller contract now includes the detail use case and has no user header arguments.
          p = Path('app/backend-service/src/test/java/com/narrativex/backend/feature/project/api/ProjectControllerContractTest.java')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import com.narrativex.backend.feature.project.application.usecase.CreateStoryVersionUseCase;',
                              'import com.narrativex.backend.feature.project.application.usecase.CreateStoryVersionUseCase;\nimport com.narrativex.backend.feature.project.application.usecase.GetProjectUseCase;')
          text = text.replace('private final CreateProjectUseCase createProjectUseCase = mock(CreateProjectUseCase.class);',
                              'private final GetProjectUseCase getProjectUseCase = mock(GetProjectUseCase.class);\n    private final CreateProjectUseCase createProjectUseCase = mock(CreateProjectUseCase.class);')
          text = text.replace('listProjectsUseCase,\n            createProjectUseCase,', 'listProjectsUseCase,\n            getProjectUseCase,\n            createProjectUseCase,')
          text = text.replace('controller.list("owner", "cursor-token", 100)', 'controller.list("cursor-token", 100)')
          text = text.replace('new ProjectListQuery("owner", "cursor-token", 100)', 'new ProjectListQuery(null, "cursor-token", 100)')
          text = text.replace('controller.create(\n            new CreateProjectRequest("Story", null, null, null, null, null),\n            "owner")',
                              'controller.create(new CreateProjectRequest("Story", null, null, null, null, null))')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify backend
        working-directory: app/backend-service
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress spotless:apply
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify frontend
        working-directory: app/frontend-web
        run: |
          npm ci
          npm run lint
          npm run type-check
          npm run build

      - name: Commit product code only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app AGENTS.md README.md documentation contracts || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: use security context and real project APIs'
          git push origin HEAD:agent/full-api-runtime-integration
